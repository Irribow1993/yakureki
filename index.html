<style>
:root{color-scheme:dark;--bg:#004c4c;--bg2:#00605a;--card:#06605a;--line:rgba(140,255,220,.25);--acc:#4be8ac;--acc2:#ffb238;--new:#ff3d7a;--mute:#8fc6b8;--tx:#eafff5;
 --nav-h:calc(56px + env(safe-area-inset-bottom,0px));}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;background:var(--bg);color:var(--tx);touch-action:manipulation;overscroll-behavior:none;
 font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic","Meiryo",system-ui,sans-serif;-webkit-user-select:none;user-select:none;}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation;}
.app{max-width:520px;margin:0 auto;min-height:100dvh;padding-bottom:calc(var(--nav-h) + 24px);}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:rgba(0,56,56,.96);backdrop-filter:blur(4px);border-bottom:1px solid var(--line);
 padding:8px 12px 8px;}
.era-row{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:6px;}
.era-row::-webkit-scrollbar{display:none;}
.chip{flex:0 0 auto;font-size:.66rem;padding:3px 9px;border-radius:99px;border:1px solid var(--line);color:var(--mute);white-space:nowrap;}
.chip.cur{background:var(--acc);color:#00302a;border-color:var(--acc);font-weight:900;}
.chip.done{color:var(--acc);border-color:rgba(75,232,172,.5);}
.res{display:flex;gap:14px;align-items:flex-end;}
.res .r{display:flex;flex-direction:column;}
.res b{font-size:1.15rem;color:#8dfad0;line-height:1.15;font-variant-numeric:tabular-nums;}
.res small{font-size:.58rem;color:var(--mute);}
.res .grow{flex:1;}
.tapbtn{background:linear-gradient(#2fd49a,#12a874);color:#00302a;border:0;border-radius:12px;padding:8px 12px;font-weight:900;font-size:.8rem;box-shadow:0 3px 0 #0a7a58;}
.tapbtn:active{transform:translateY(2px);box-shadow:0 1px 0 #0a7a58;}
.flow{display:flex;justify-content:space-between;gap:2px;margin-top:7px;font-size:.55rem;color:var(--mute);text-align:center;}
.flow span{flex:1;padding:2px 0;border-radius:6px;background:rgba(255,255,255,.05);}
.flow i{font-style:normal;color:var(--acc);align-self:center;}
.eraprog{margin-top:7px;background:rgba(255,255,255,.06);border-radius:10px;padding:6px 9px;font-size:.66rem;}
.eraprog summary{cursor:pointer;list-style:none;display:flex;justify-content:space-between;gap:8px;}
.eraprog summary::-webkit-details-marker{display:none;}
.eraprog ul{margin:6px 0 2px;padding-left:2px;list-style:none;color:var(--mute);}
.eraprog li.ok{color:var(--acc);}
.bar{height:5px;border-radius:5px;background:rgba(255,255,255,.12);overflow:hidden;margin-top:4px;}
.bar i{display:block;height:100%;background:var(--acc);width:0;transition:width .3s;}
main{padding:10px 12px;}
.sec{margin:14px 0 6px;font-size:.78rem;font-weight:900;color:#8dfad0;display:flex;align-items:center;gap:6px;}
.sec small{font-weight:400;color:var(--mute);font-size:.62rem;}
.chain{display:flex;flex-direction:column;align-items:stretch;gap:0;}
.arrow{text-align:center;color:var(--acc);font-size:.8rem;line-height:1;height:14px;opacity:.7;}
.tn{width:100%;text-align:left;display:grid;grid-template-columns:26px 1fr auto;align-items:center;gap:8px;background:var(--card);
 border:1px solid var(--line);border-radius:12px;padding:9px 11px;}
.tn .mk{font-size:1rem;text-align:center;}
.tn .nm{font-weight:800;font-size:.86rem;}
.tn .st{font-size:.68rem;color:var(--acc2);font-weight:800;white-space:nowrap;}
.tn .sub{grid-column:2/4;font-size:.62rem;color:var(--mute);margin-top:-4px;}
.tn.done{background:rgba(75,232,172,.14);border-color:rgba(75,232,172,.5);}
.tn.done .st{color:var(--acc);}
.tn.locked,.tn.eralock{opacity:.55;}
.tn.avail.afford{border-color:var(--acc2);box-shadow:0 0 0 1px var(--acc2) inset;}
.tn.avail:not(.afford) .st{color:var(--mute);}
.fr{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin-bottom:8px;}
.fr .top{display:flex;justify-content:space-between;align-items:baseline;gap:8px;}
.fr .nm{font-weight:900;font-size:.95rem;}
.fr .cnt{font-size:.8rem;color:var(--acc);font-weight:800;}
.fr .ds{font-size:.7rem;color:var(--mute);margin:2px 0 6px;line-height:1.5;}
.fr .pr{font-size:.7rem;margin-bottom:7px;}
.fr .btns{display:flex;gap:6px;}
.btn{flex:1;border:0;border-radius:10px;padding:8px 6px;font-weight:900;font-size:.76rem;background:#12a874;color:#00302a;}
.btn.sub{background:rgba(255,255,255,.12);color:var(--tx);}
.btn.off{background:rgba(255,255,255,.1);color:#7fa89c;}
.btn small{display:block;font-weight:700;font-size:.62rem;opacity:.85;}
.fr.lock{opacity:.55;}
.qty{display:flex;gap:6px;margin-bottom:8px;}
.qty button{flex:1;border:1px solid var(--line);background:transparent;border-radius:9px;padding:6px;font-size:.74rem;color:var(--mute);}
.qty button.on{background:var(--acc);color:#00302a;font-weight:900;border-color:var(--acc);}
.evrow{display:grid;grid-template-columns:34px 1fr auto;gap:8px;align-items:center;width:100%;text-align:left;background:var(--card);
 border:1px solid var(--line);border-radius:12px;padding:9px 11px;margin-bottom:6px;}
.evrow .yr{font-size:.6rem;color:var(--mute);text-align:center;line-height:1.2;}
.evrow .tt{font-weight:800;font-size:.84rem;}
.evrow .sb{font-size:.62rem;color:var(--mute);}
.evrow.q{opacity:.6;}
.evrow.q .tt{color:var(--mute);}
.badge{background:var(--new);color:#fff;font-size:.6rem;font-weight:900;border-radius:99px;padding:1px 7px;}
nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(0,48,48,.97);border-top:1px solid var(--line);
 padding-bottom:env(safe-area-inset-bottom,0px);}
nav .in{max-width:520px;margin:0 auto;display:flex;}
nav button{flex:1;background:none;border:0;padding:7px 0 6px;font-size:.62rem;color:var(--mute);position:relative;display:flex;flex-direction:column;align-items:center;gap:1px;}
nav button b{font-size:1.15rem;font-weight:400;line-height:1.1;}
nav button.on{color:var(--acc);}
nav button .dot{position:absolute;top:4px;right:calc(50% - 20px);width:9px;height:9px;border-radius:50%;background:var(--new);display:none;}
.ov{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.6);display:none;align-items:flex-end;justify-content:center;}
.ov.show{display:flex;}
.ov.mid{align-items:center;padding:16px;}
.sheet{width:100%;max-width:520px;background:#073f3b;border:1px solid var(--line);border-radius:18px 18px 0 0;padding:16px 16px calc(18px + env(safe-area-inset-bottom,0px));max-height:86dvh;overflow:auto;position:relative;}
.ov.mid .sheet{border-radius:18px;}
.sheet h3{margin:0 0 4px;font-size:1.05rem;}
.sheet .tag{font-size:.64rem;color:var(--acc2);font-weight:900;letter-spacing:.08em;}
.sheet .meta{font-size:.68rem;color:var(--mute);margin-bottom:8px;}
.sheet p{font-size:.8rem;line-height:1.75;margin:8px 0;}
.sheet .box{background:rgba(255,255,255,.07);border-radius:10px;padding:8px 10px;font-size:.74rem;line-height:1.6;margin:8px 0;}
.sheet .box b{color:var(--acc);}
.sheet .navtop{background:none;border:0;color:var(--acc);font:inherit;font-size:.74rem;font-weight:800;padding:0 0 6px;}
.sheet .x{position:absolute;top:10px;right:12px;background:none;border:0;font-size:1.1rem;color:var(--mute);}
.sheet ul{margin:4px 0;padding-left:2px;list-style:none;font-size:.76rem;line-height:1.7;}
.sheet li.ok{color:var(--acc);}
.sheet li.ng{color:#ffb7b7;}
.big{width:100%;border:0;border-radius:12px;padding:12px;font-weight:900;font-size:.9rem;background:linear-gradient(#2fd49a,#12a874);color:#00302a;margin-top:6px;}
.big.off{background:rgba(255,255,255,.12);color:#7fa89c;}
.toast{position:fixed;left:50%;top:calc(76px + env(safe-area-inset-top,0px));transform:translate(-50%,-20px);z-index:60;background:#0a8a68;color:#fff;
 border-radius:12px;padding:9px 14px;font-size:.78rem;font-weight:800;opacity:0;pointer-events:none;transition:.3s;max-width:92vw;text-align:center;}
.toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto;}
.fl{position:fixed;z-index:40;pointer-events:none;font-weight:900;color:#8dfad0;text-shadow:0 1px 3px #000;animation:fl .7s ease-out forwards;}
@keyframes fl{to{transform:translateY(-40px);opacity:0;}}
.stat{display:grid;grid-template-columns:1fr auto;gap:2px 8px;font-size:.84rem;}
.stat div:nth-child(odd){color:var(--mute);}
.note{font-size:.64rem;color:var(--mute);line-height:1.6;margin:10px 0;}
textarea{width:100%;height:70px;background:rgba(0,0,0,.25);color:var(--tx);border:1px solid var(--line);border-radius:8px;font-size:.6rem;-webkit-user-select:text;user-select:text;}
.era-banner{text-align:center;padding:10px 0;}
.era-banner .t{font-size:.7rem;color:var(--acc2);font-weight:900;letter-spacing:.2em;}
.era-banner .n{font-size:1.6rem;font-weight:900;margin:6px 0 2px;}
.recap{display:flex;flex-direction:column;gap:3px;font-size:.78rem;margin:8px 0;}
.recap div{display:flex;gap:8px;align-items:center;}
.recap .c{color:var(--acc);}

.subtabs{display:flex;gap:6px;margin:4px 0 6px;}
.subtabs button{flex:1;border:1px solid var(--line);background:transparent;border-radius:10px;padding:8px 6px;font-size:.78rem;color:var(--mute);font-weight:800;position:relative;}
.subtabs button.on{background:var(--acc);color:#00302a;border-color:var(--acc);}
.subtabs small{font-size:.6rem;font-weight:700;opacity:.85;}
.sdot{position:absolute;top:5px;right:8px;width:8px;height:8px;border-radius:50%;background:var(--new);}
.yr.pic{font-size:1.1rem;}
.rgrow{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:4px 0 8px;padding-bottom:2px;}
.rgrow::-webkit-scrollbar{display:none;}
.rg{flex:0 0 auto;border:1px solid var(--line);background:transparent;border-radius:99px;padding:5px 10px;font-size:.68rem;color:var(--mute);white-space:nowrap;}
.rg small{font-size:.58rem;opacity:.8;}
.rg.on{background:var(--acc);color:#00302a;border-color:var(--acc);font-weight:900;}
.erah small{color:var(--mute);font-weight:700;margin-left:4px;}
.erah{font-size:.66rem;color:var(--acc2);font-weight:900;margin:12px 2px 5px;letter-spacing:.06em;}
.rtag{display:inline-block;font-size:.55rem;border:1px solid var(--line);border-radius:6px;padding:0 5px;margin-right:5px;color:var(--acc);}
.howto{font-size:.72rem;line-height:1.7;}
.howto ol{margin:4px 0;padding-left:1.3em;}
.stages{display:flex;align-items:stretch;gap:3px;margin-bottom:10px;overflow-x:auto;}
.stages>div{flex:1 0 62px;background:rgba(255,255,255,.06);border-radius:9px;padding:5px 4px;text-align:center;font-size:.58rem;color:var(--mute);}
.stages>div b{display:block;font-size:.66rem;color:var(--tx);}
.stages>div.on{background:rgba(75,232,172,.14);} .stages>div.on span{color:var(--acc);font-weight:800;}
.fh{font-size:.68rem;color:var(--acc2);margin:-2px 0 7px;}
.fh b{color:var(--tx);}
.tn.unk{cursor:default;}
.tn.unk .nm{color:var(--mute);letter-spacing:.2em;}
.tn.unk .st{color:var(--mute);font-weight:700;}
.pctl{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 10px;}
.pctl input,.pctl select{font:inherit;font-size:.78rem;color:var(--tx);background:rgba(0,0,0,.22);border:1px solid var(--line);border-radius:10px;padding:8px 10px;min-width:0;}
.pctl input{flex:1 1 100%;}
.pctl select{flex:1 1 30%;}
.pctl input:focus,.pctl select:focus{outline:2px solid var(--acc);outline-offset:1px;}
.chaph{display:flex;align-items:center;gap:10px;margin:16px 2px 6px;}
.chaph .no{flex:none;min-width:2.2em;height:2.2em;padding:0 6px;border-radius:8px;border:1px solid var(--acc2);color:var(--acc2);font-weight:900;font-size:.72rem;display:flex;align-items:center;justify-content:center;font-family:Georgia,"Times New Roman",serif;}
.chaph b{display:block;font-size:.84rem;}
.chaph small{display:block;font-size:.64rem;color:var(--mute);}
.chaph em{margin-left:auto;font-style:normal;font-size:.64rem;color:var(--mute);font-variant-numeric:tabular-nums;white-space:nowrap;}
.pcard .imp{font-size:.66rem;color:var(--acc);margin-top:2px;line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.pend{margin:18px 0 8px;padding:14px 16px;border-top:1px solid var(--acc2);border-bottom:1px solid var(--acc2);font-size:.8rem;line-height:1.95;}
.pend p{margin:0 0 6px;}
.sheet .impact{border-left:3px solid var(--acc2);background:rgba(255,178,56,.08);border-radius:0 10px 10px 0;padding:8px 12px;margin:10px 0;}
.sheet .impact b{font-size:.68rem;color:var(--acc2);letter-spacing:.06em;}
.sheet .impact p{margin:4px 0 0;font-size:.84rem;font-weight:700;line-height:1.7;}
.sheet .ptext p{font-size:.84rem;line-height:1.95;margin:0 0 10px;}
.sheet .caution{border:1px dashed var(--acc2);border-radius:10px;padding:8px 12px;margin:10px 0;}
.sheet .caution b{font-size:.68rem;color:var(--acc2);}
.sheet .caution p{margin:4px 0 0;font-size:.76rem;line-height:1.75;}
.sheet .box.sm{font-size:.68rem;opacity:.85;}
.rels{display:flex;flex-direction:column;gap:6px;margin-top:6px;}
.relrow{display:grid;grid-template-columns:1fr auto;grid-template-areas:"rl i" "rn i";align-items:center;text-align:left;width:100%;font:inherit;color:var(--tx);background:rgba(0,0,0,.18);border:1px solid var(--line);border-radius:10px;padding:7px 10px;gap:1px 8px;}
.relrow .rl{grid-area:rl;font-size:.64rem;color:var(--acc2);font-weight:800;}
.relrow .rn{grid-area:rn;font-size:.82rem;font-weight:800;}
.relrow i{grid-area:i;font-style:normal;color:var(--acc);font-size:1.1rem;}
.relrow.off{opacity:.55;}
.lks{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px;}
.lk{font:inherit;font-size:.72rem;color:var(--tx);background:rgba(0,0,0,.18);border:1px solid var(--line);border-radius:99px;padding:4px 10px;}
.lk.th{color:var(--acc);}
.lk.plain{border-style:dashed;color:var(--mute);}
.lk.off{opacity:.55;}
.lk small{margin-left:4px;font-size:.6rem;color:var(--mute);}
.navback{display:flex;flex-direction:column;align-items:flex-start;width:100%;margin-top:12px;font:inherit;font-size:.8rem;font-weight:800;color:var(--acc);background:none;border:1px solid var(--line);border-radius:10px;padding:8px 12px;text-align:left;}
.navback small{font-size:.64rem;color:var(--mute);font-weight:700;}
.stages>i{font-style:normal;color:var(--acc);align-self:center;font-size:.8rem;}
/* ===== プロローグ（経験のはじまり）：本編と同じ深緑を一段暗くし、情報を最小限に ===== */
.pro{position:fixed;inset:0;z-index:70;overflow:auto;color:var(--tx);
 background:radial-gradient(120% 75% at 50% 108%,#00524b 0%,#002b29 48%,#001414 100%);
 padding:calc(28px + env(safe-area-inset-top,0px)) 20px calc(20px + env(safe-area-inset-bottom,0px));transition:opacity .9s ease;}
.pro.out{opacity:0;pointer-events:none;}
.pro-in{max-width:440px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;}
.pro-tag{font-size:.66rem;letter-spacing:.42em;color:var(--acc2);font-weight:900;text-align:center;margin-top:4vh;}
.pro h1{font-size:1.9rem;font-weight:900;text-align:center;margin:10px 0 4px;letter-spacing:.08em;}
.pro-when{text-align:center;color:var(--acc);font-weight:800;font-size:.9rem;margin-bottom:14px;}
.pro-lead{font-size:.82rem;line-height:2;text-align:center;color:var(--mute);margin:0 0 18px;}
.pro-stage{flex:1;display:flex;flex-direction:column;align-items:center;gap:14px;transition:opacity .5s;}
.pro-kp{display:flex;flex-direction:column;align-items:center;animation:proIn .5s ease;}
.pro-kp b{font-size:2rem;color:#8dfad0;font-variant-numeric:tabular-nums;line-height:1;}
.pro-kp small{font-size:.66rem;color:var(--mute);margin-top:2px;}
.pro-btn{width:190px;height:190px;border-radius:50%;border:0;font-weight:900;font-size:1.15rem;color:#00302a;
 background:radial-gradient(circle at 40% 32%,#8dfad0,#2fd49a 50%,#12a874);box-shadow:0 0 0 10px rgba(75,232,172,.08),0 0 40px rgba(75,232,172,.25),0 6px 0 #0a7a58;
 animation:proGlow 2.4s ease-in-out infinite;}
.pro-btn:active{transform:translateY(4px);box-shadow:0 0 0 10px rgba(75,232,172,.08),0 2px 0 #0a7a58;}
.pro-btn:disabled{opacity:.4;animation:none;}
.pro-dots{display:flex;gap:8px;}
.pro-dots i{width:9px;height:9px;border-radius:50%;background:rgba(140,255,220,.18);transition:background .3s;}
.pro-dots i.on{background:var(--acc);}
.pro-log{min-height:5.4em;width:100%;text-align:center;font-size:.84rem;line-height:1.8;}
.pro-log div{animation:proIn .6s ease;color:#5f978a;}
.pro-log div:last-child{color:var(--tx);}
.pro-def{width:100%;background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:12px;padding:10px 14px;font-size:.78rem;line-height:1.7;animation:proIn .6s ease;}
.pro-def b{color:var(--acc);}
.pro-card{background:#073f3b;border:1px solid rgba(75,232,172,.5);border-radius:18px;padding:20px 18px;margin-top:6px;
 box-shadow:0 10px 40px rgba(0,0,0,.45);animation:proCard .8s cubic-bezier(.2,.8,.2,1);}
.pro-card .t{font-size:.62rem;letter-spacing:.2em;color:var(--acc2);font-weight:900;}
.pro-card h2{margin:6px 0 2px;font-size:1.45rem;}
.pro-card h4{margin:0 0 4px;font-size:.84rem;color:var(--acc);}
.pro-card .meta{font-size:.66rem;color:var(--mute);margin-bottom:6px;}
.pro-card p{font-size:.8rem;line-height:1.9;margin:8px 0;}
.pro-card .box{background:rgba(255,255,255,.07);border-radius:10px;padding:8px 10px;font-size:.74rem;line-height:1.6;margin:10px 0;}

   "life": "129ごろ〜216ごろ",
   "role": "医師",
   "text": "ペルガモン出身の医師。ローマで皇帝の侍医を務め、膨大な著作で解剖学・生理学・薬物学を体系化した。その学説は中世を通じて、ヨーロッパとイスラム世界の医学の権威となった。"
  },
  "zhang_zhongjing": {
   "name": "張仲景",
   "life": "2〜3世紀",
   "role": "医師",
   "text": "後漢末の医師と伝えられる。『傷寒雑病論』を著したとされ、のちに再編された『傷寒論』『金匱要略』は、漢方の処方の古典として今も重んじられている。現在の形の書物は後世の編集を経ており、生涯にも不明な点が多い。"
  },
  "charaka": {
   "name": "チャラカ",
   "life": "年代不詳",
   "role": "医師",
   "text": "インドの伝統医学アーユルヴェーダの古典『チャラカ・サンヒター』に名を残す医師。内科を中心に多くの薬草を扱う書だが、長い時間をかけて編集・増補されたと考えられ、チャラカ本人が今の形にまとめたわけではない。成立年代にも諸説がある。"
  },
  "sushruta": {
   "name": "スシュルタ",
   "life": "年代不詳",
   "role": "医師",
   "text": "古代インドの外科医学を代表する人物とされ、外科を中心とするアーユルヴェーダの古典『スシュルタ・サンヒター』に名を残す。手術の方法や器具、薬を記した書だが、成立年代や人物像には諸説がある。"
  },
  "ge_hong": {
   "name": "葛洪",
   "life": "283〜343ごろ",
   "role": "道士・医家",
   "text": "東晋の道士・医家。仙薬づくり（錬丹）を論じた『抱朴子』と、手近な材料で急病に対処する処方を集めた『肘後備急方』を著した。"
  },
  "tao_hongjing": {
   "name": "陶弘景",
   "life": "456〜536",
   "role": "学者・道士",
   "text": "中国・南北朝時代の学者。『神農本草経』に注を加えて『本草経集注』をまとめ、多数の薬物を整理・分類した。のちの本草書の基礎となった。"
  },
  "cassiodorus": {
   "name": "カッシオドルス",
   "life": "485ごろ〜585ごろ",
   "role": "政治家・学者",
   "text": "東ゴート王国に仕えたのち、南イタリアにウィウァリウム修道院を開いた学者。写本作りを修道士の務めとし、薬草について学ぶことや、ヒポクラテス、ガレノス、ディオスコリデスの書を読むことを勧めたとされる。"
  },
  "aetius": {
   "name": "アミダのアエティオス",
   "life": "6世紀",
   "role": "医師",
   "text": "ビザンツ帝国の医師。古代の医学・薬物の知識を集めた全16巻の医学書を著し、失われた古い医書の内容もその中に伝えている。"
  },
  "paul_aegina": {
   "name": "アイギナのパウロス",
   "life": "7世紀",
   "role": "医師",
   "text": "ビザンツ世界の医師。全7巻の医学の集成を著し、とくに外科の記述で知られる。その書はのちにアラビア語にも訳された。"
  },
  "sun_simiao": {
   "name": "孫思邈",
   "life": "581ごろ〜682",
   "role": "医師",
   "text": "唐の医師。『千金要方』『千金翼方』という大部の医書を著した。医師の心構えを説いた「大医精誠」の一節でも知られ、後世「薬王」と尊称された。"
  },
  "su_jing": {
   "name": "蘇敬",
   "life": "7世紀",
   "role": "官人・医家",
   "text": "唐代の国家的な本草の編纂事業に関わり、659年に成立した『新修本草』の成立に重要な役割を果たした。この書は日本にも伝わって学ばれた。"
  },
  "hunayn_p": {
   "name": "フナイン・イブン・イスハーク",
   "life": "809〜873",
   "role": "医師・翻訳家",
   "text": "バグダッドで活躍したネストリウス派キリスト教徒の医師・翻訳家。ギリシア語の写本を突き合わせて本文を整え、ガレノスらの医学書を多数シリア語やアラビア語に訳した。"
  },
  "jabir_p": {
   "name": "ジャービル・イブン・ハイヤーン",
   "life": "8世紀ごろとされる（実在に議論あり）",
   "role": "錬金術文献群に名を残す人物",
   "text": "その名で伝えられる膨大な錬金術の文書群に関係づけられる人物。実在や生涯には議論があり、文書群は複数の著者によって長い期間に書かれたものとみられる。蒸留・結晶化などの操作が体系的に記されているが、それらを一人で考案したわけではない。"
  },
  "razi": {
   "name": "ラーズィー",
   "life": "9〜10世紀",
   "role": "医師",
   "text": "ペルシア出身の医師。病院の長を務めて臨床の観察を重んじ、天然痘と麻疹を区別して論じた。医学の大集成『ハーウィー』など、多くの著作を残した。"
  },
  "ibn_sina": {
   "name": "イブン・スィーナー",
   "life": "980〜1037",
   "role": "医師・哲学者",
   "text": "ラテン名アヴィセンナ。ペルシアの医師・哲学者。全5巻の『医学典範』でギリシアとアラビアの医学を体系化し、その書はラテン語に訳されてヨーロッパの大学でも長く教科書となった。"
  },
  "zahrawi": {
   "name": "ザフラーウィー",
   "life": "936ごろ〜1013ごろ",
   "role": "医師・外科医",
   "text": "イスラム支配下のイベリア半島（アンダルス）の医師。全30巻の医学書『タスリーフ』を著した。外科の巻は器具の図とともにラテン語に訳され、ヨーロッパでも長く読まれた。"
  },
  "biruni": {
   "name": "ビールーニー",
   "life": "973〜1048ごろ",
   "role": "学者",
   "text": "天文学・地理学など幅広い分野で業績を残した学者。薬物学書『薬学の書（キターブ・アッ＝サイダナ）』を著し、薬物の名前やその由来、各言語での呼び名を比較・整理した。"
  },
  "tamba": {
   "name": "丹波康頼",
   "life": "912〜995",
   "role": "医師",
   "text": "平安時代の宮廷医。984年、中国の多くの医書を引用して編んだ全30巻の『医心方』を朝廷に献上した。現存する日本最古の医書とされ、今では失われた書の内容も伝える。"
  },
  "constantine_p": {
   "name": "コンスタンティヌス・アフリカヌス",
   "life": "11世紀",
   "role": "翻訳家・修道士",
   "text": "北アフリカ出身で、サレルノを経てモンテ・カッシーノ修道院に入り、アラビア語の医学書をラテン語に訳した。西ヨーロッパにアラビア医学を広く紹介した。"
  },
  "trota": {
   "name": "トロータ",
   "life": "12世紀ごろ",
   "role": "女性医療者",
   "text": "サレルノの医学に関連づけられる女性医療者。女性の病気とその治療を扱う「トロトゥーラ」と呼ばれる文書群に名を残すが、その著者・成立事情には議論があり、どこまでが本人の著作かは分かっていない。"
  },
  "hildegard_p": {
   "name": "ビンゲンのヒルデガルト",
   "life": "1098〜1179",
   "role": "修道院長",
   "text": "ライン川流域のベネディクト会の女子修道院長。『フィジカ』で植物・樹木・石・動物などの薬効を記した。音楽や神学の著作でも知られる。"
  },
  "nicolaus": {
   "name": "ニコラウス",
   "life": "不詳",
   "role": "（不詳）",
   "text": "中世ヨーロッパで広く用いられた処方集『アンティドタリウム・ニコライ』に名を残す人物。処方集はサレルノに関係づけられるが、ニコラウスという著者の人物像や、著者が誰かについては不確かな点が多い。"
  },
  "frederick2": {
   "name": "フリードリヒ2世",
   "life": "1194〜1250",
   "role": "神聖ローマ皇帝・シチリア王",
   "text": "シチリア王を兼ねた神聖ローマ皇帝。1231年のメルフィ憲章などで、医師の資格制度や、薬剤師・薬局に対する規制を整えた。"
  },
  "ibn_baytar": {
   "name": "イブン・アル＝バイタール",
   "life": "1197ごろ〜1248",
   "role": "薬物学者",
   "text": "アンダルス出身の薬物学者。北アフリカや東地中海の各地を巡って植物を調べ、約1,400項目（数え方には諸説ある）の薬物・食品を収めた集成を著した。のちにカイロで薬物学者の長を務めた。"
  },
  "rupescissa_p": {
   "name": "ヨハネス・デ・ルペシッサ",
   "life": "14世紀",
   "role": "錬金術師・修道士",
   "text": "フランスのフランシスコ会士。ワインを繰り返し蒸留して得たアルコールを「第五元素（第五精髄）」とみなし、その医療への利用を説いた。蒸留したアルコールそのものは、彼以前から知られていた。"
  },
  "paracelsus_p": {
   "name": "パラケルスス",
   "life": "1493〜1541",
   "role": "医師",
   "text": "スイス生まれの医師。ガレノス流の医学を批判し、鉱物や金属など化学的な物質を治療に用いることを説いた。用量と毒性の関係を論じたことから、後世「毒性学の先駆」とも評される。"
  },
  "brunfels": {
   "name": "オットー・ブルンフェルス",
   "life": "1488ごろ〜1534",
   "role": "植物学者・神学者",
   "text": "ドイツの神学者・植物学者。1530年から刊行された植物図譜では、実物を写生した木版の挿絵が用いられ、写実的な植物図の早い例として知られる。"
  },
  "fuchs_p": {
   "name": "レオンハルト・フックス",
   "life": "1501〜1566",
   "role": "医師・植物学者",
   "text": "ドイツの医師。1542年、実物観察を重視した挿絵入りの植物誌『De historia stirpium』を刊行した。植物の「フクシア」は彼にちなんで名づけられた。"
  },
  "cordus_p": {
   "name": "ヴァレリウス・コルドゥス",
   "life": "1515〜1544",
   "role": "薬剤師・植物学者",
   "text": "ドイツの薬剤師・植物学者。彼がまとめた調剤書は没後にニュルンベルクで刊行され、市の公的な基準として用いられた。29歳の若さで亡くなった。"
  },
  "de_la_cruz": {
   "name": "マルティン・デ・ラ・クルス",
   "life": "16世紀",
   "role": "先住民の医師",
   "text": "メキシコの先住民の医師。メキシコ先住民の薬用植物・医療の知識を記録した1552年の薬草書（バディアーノ写本）の内容を、編纂・記録した人物とされる。生涯について分かっていることは多くない。"
  },
  "badiano": {
   "name": "フアン・バディアーノ",
   "life": "16世紀",
   "role": "先住民の学者・翻訳者",
   "text": "メキシコの先住民の出身で、ラテン語を学んだ学者。デ・ラ・クルスがまとめた薬草書をラテン語に翻訳したとされ、写本は彼の名で呼ばれる。内容の編纂・記録はデ・ラ・クルス、ラテン語訳はバディアーノという分担だったと考えられている。"
  },
  "orta_p": {
   "name": "ガルシア・デ・オルタ",
   "life": "1501ごろ〜1568",
   "role": "医師",
   "text": "ポルトガル出身の医師。インドのゴアに移り住み、1563年に対話形式の『インド薬物誌』を刊行した。現地での観察にもとづき、インドの薬用植物を記録した。"
  },
  "monardes_p": {
   "name": "ニコラス・モナルデス",
   "life": "1493〜1588",
   "role": "医師",
   "text": "スペイン・セビリアの医師。自らは新大陸へ渡らなかったが、港に届く産物を調べ、新大陸由来の薬物を記録した書を著した。"
  },
  "clusius": {
   "name": "カロルス・クルシウス",
   "life": "1526〜1609",
   "role": "植物学者",
   "text": "フランドル出身の植物学者。オルタの『インド薬物誌』を要約し注釈を加えたラテン語版を出版して、ヨーロッパでの普及に関わった。晩年はライデン大学の植物園に関わり、チューリップの栽培でも知られる。"
  },
  "li_shizhen": {
   "name": "李時珍",
   "life": "1518〜1593",
   "role": "医師・本草学者",
   "text": "明の医師・本草学者。長年にわたって各地の薬物を調べ、『本草綱目』をまとめた。刊行は没後の1596年である。"
  },
  "hayashi_razan": {
   "name": "林羅山",
   "life": "1583〜1657",
   "role": "儒学者",
   "text": "江戸初期の儒学者で、徳川家康以後の将軍に仕えた。『本草綱目』の日本への伝来・普及に関わったとされ、1607年に長崎で入手して家康に献上したと伝えられる。"
  },
  "de_laune": {
   "name": "ギデオン・ド・ローン",
   "life": "1565ごろ〜1659",
   "role": "薬剤師",
   "text": "フランスから逃れたプロテスタント（ユグノー）の家に生まれ、ロンドンで活躍した薬剤師。ジェームズ1世の王妃アンの薬剤師を務め、食料品商組合からの分離を求める薬剤師たちを率いて、1617年のロンドン薬剤師協会の設立に関わった。"
  },
  "mayerne": {
   "name": "テオドール・ド・マイエルヌ",
   "life": "1573〜1655",
   "role": "医師",
   "text": "ジュネーヴ出身の医師で、イングランド王の侍医を務めた。化学的な薬剤の使用を支持し、1618年の『ロンドン薬局方』の編纂に関わって、巻末に化学的な薬剤の項を加えたとされる。"
  },
  "van_helmont": {
   "name": "ファン・ヘルモント",
   "life": "1580〜1644",
   "role": "医師・化学者",
   "text": "フランドルの医師・化学者。パラケルススの影響を受けた医化学者の一人で、「ガス」という言葉をつくったことでも知られる。"
  },
  "sydenham_p": {
   "name": "トーマス・シデナム",
   "life": "1624〜1689",
   "role": "医師",
   "text": "イングランドの医師。書物の理論よりも、病気の経過を注意深く観察して記録することを重んじた。のちに「イギリスのヒポクラテス」と呼ばれた。"
  },
  "boyle": {
   "name": "ロバート・ボイル",
   "life": "1627〜1691",
   "role": "自然哲学者・化学者",
   "text": "アイルランド出身の自然哲学者。1661年の『懐疑的化学者』で、実験にもとづいて物質を考える姿勢を示し、化学を実験的・定量的に扱う方向に影響を与えた。気体の圧力と体積の関係（ボイルの法則）でも知られる。"
  },
  "lemery": {
   "name": "ニコラ・レムリ",
   "life": "1645〜1715",
   "role": "薬剤師・化学者",
   "text": "フランスの薬剤師・化学者。1675年の『化学教程』は版を重ね、各国語に訳されて広く読まれた。"
  },
  "linnaeus": {
   "name": "カール・リンネ",
   "life": "1707〜1778",
   "role": "植物学者・医師",
   "text": "スウェーデンの植物学者・医師。1753年の『植物の種』で、属名と種小名の二語による植物の命名（二名法）を体系的に用いた。薬用植物を含む植物の名前を世界共通で呼べる、近代的な分類学の土台を整えた。"
  },
  "montagu": {
   "name": "メアリー・ウォートリー・モンタギュー",
   "life": "1689〜1762",
   "role": "著述家",
   "text": "イギリスの貴族の女性。大使の妻としてオスマン帝国に滞在した際、現地で以前から行われていた人痘接種を知った。帰国後、イギリスでの人痘接種の紹介と普及を促した。人痘接種は、のちのジェンナーの牛痘接種とは別の方法である。"
  },
  "lind_p": {
   "name": "ジェームズ・リンド",
   "life": "1716〜1794",
   "role": "海軍軍医",
   "text": "スコットランド出身の海軍軍医。1747年、壊血病の患者を複数の治療の組に分けて比べ、治療の効果を検討した。1753年に『壊血病論』を出版した。"
  },
  "withering_p": {
   "name": "ウィリアム・ウィザリング",
   "life": "1741〜1799",
   "role": "医師・植物学者",
   "text": "イングランドの医師・植物学者。1785年、ジギタリスを用いた治療の経験を整理し、適応・調製法・用量などを記録した報告を著した。ジギタリスの有効成分を取り出したわけではない。"
  },
  "kaibara": {
   "name": "貝原益軒",
   "life": "1630〜1714",
   "role": "儒学者・本草学者",
   "text": "江戸時代の儒学者・本草学者。1709年に『大和本草』を刊行し、薬用植物を含む多くの動植物や産物を、『本草綱目』の分類に独自の工夫を加えて記載した。健康の心得を説いた『養生訓』でも知られる。"
  },
  "yoshimune": {
   "name": "徳川吉宗",
   "life": "1684〜1751",
   "role": "江戸幕府8代将軍",
   "text": "享保の改革を進めた将軍。医療や本草学の振興を進め、1722年には小石川御薬園の中に養生所を設けた。薬用植物の栽培や調査も奨励した。"
  },
  "ogawa_shosen": {
   "name": "小川笙船",
   "life": "1672〜1760",
   "role": "町医者",
   "text": "江戸の町医者。貧しい病人のための施療所の設置を求めて、目安箱に意見を出したとされる。小石川養生所の設置につながった人物として知られる。"
  },
  "tamura_ransui": {
   "name": "田村藍水",
   "life": "1718〜1776",
   "role": "本草学者・医師",
   "text": "江戸の本草学者・医師。朝鮮人参の国産化をめざして栽培の研究を進めた。平賀源内の師で、1757年には源内の提唱により江戸・湯島で薬品会を開き、その後も会主として続けた。"
  },
  "gennai": {
   "name": "平賀源内",
   "life": "1728〜1780",
   "role": "本草学者・発明家",
   "text": "讃岐出身の本草学者で、田村藍水の門人。1757年、師の藍水に提唱して薬品会（物産会）を開かせ、1762年には自ら会主となって開いた。翌1763年、それまでの会の出品物から選んだものを『物類品隲』にまとめた。エレキテルの復元など、本草学以外でも幅広く活動した。"
  },
  "sugita": {
   "name": "杉田玄白",
   "life": "1733〜1817",
   "role": "蘭方医",
   "text": "江戸の蘭方医。前野良沢らとともにオランダ語の解剖書を訳し、1774年に『解体新書』として刊行した。観察にもとづく西洋医学が日本に広がるきっかけの一つとなった。"
  },
  "maeno": {
   "name": "前野良沢",
   "life": "1723〜1803",
   "role": "蘭方医",
   "text": "中津藩の医師。オランダ語の学習に打ち込み、杉田玄白らとの共同の翻訳作業で中心的な役割を担い、『解体新書』の刊行につながった。"
  },
  "jenner_p": {
   "name": "エドワード・ジェンナー",
   "life": "1749〜1823",
   "role": "医師",
   "text": "イングランドの医師。牛痘の材料を用いた接種を1796年に行い、1798年にその結果を報告した。この方法はのちに各地へ広がった。"
  },
  "hanaoka": {
   "name": "華岡青洲",
   "life": "1760〜1835",
   "role": "外科医",
   "text": "紀伊の外科医。曼陀羅華を主とする麻酔薬「通仙散」を工夫し、1804年に全身麻酔のもとで乳がんの手術を行ったとされる。多くの門人を育てた。"
  },
  "serturner_p": {
   "name": "フリードリヒ・ゼルチュルナー",
   "life": "1783〜1841",
   "role": "薬剤師",
   "text": "ドイツの薬剤師。アヘンから主成分を単離し、1817年の論文で「モルフィウム」として発表した。植物の有効成分の単離研究の重要な出発点の一つとされる。"
  },
  "pelletier": {
   "name": "ピエール＝ジョゼフ・ペルティエ",
   "life": "1788〜1842",
   "role": "薬剤師・化学者",
   "text": "フランスの薬剤師。カヴァントゥとともに、ストリキニーネやキニーネなど、植物のアルカロイドを単離した。"
  },
  "caventou": {
   "name": "ジョゼフ・ビヤンネメ・カヴァントゥ",
   "life": "1795〜1877",
   "role": "薬剤師・化学者",
   "text": "フランスの薬剤師。ペルティエとの共同研究で、キニーネなどのアルカロイドの単離を報告した。"
  },
  "magendie_p": {
   "name": "フランソワ・マジャンディ",
   "life": "1783〜1855",
   "role": "生理学者",
   "text": "フランスの生理学者。動物実験によって生体の働きや薬物の作用を調べ、実験生理学・実験薬理学の発展に重要な役割を果たした。"
  },
  "bernard": {
   "name": "クロード・ベルナール",
   "life": "1813〜1878",
   "role": "生理学者",
   "text": "マジャンディの弟子のフランスの生理学者。矢毒クラーレが、神経を刺激しても筋肉が収縮しなくなる作用を実験的に研究するなど、薬物を用いた生理学の研究で知られる。"
  },
  "wohler_p": {
   "name": "フリードリヒ・ヴェーラー",
   "life": "1800〜1882",
   "role": "化学者",
   "text": "ドイツの化学者。1828年に無機の塩から尿素を合成した。リービッヒとの共同研究や、アルミニウムの研究でも知られる。"
  },
  "liebig": {
   "name": "ユストゥス・フォン・リービッヒ",
   "life": "1803〜1873",
   "role": "化学者",
   "text": "ドイツの化学者。ギーセン大学の研究室で、学生に実験を通して化学を教え、多くの化学者を育てた。有機化合物の分析法の改良や、1832年のクロラールの合成でも知られる。"
  },
  "siebold_p": {
   "name": "フィリップ・フランツ・フォン・シーボルト",
   "life": "1796〜1866",
   "role": "医師・博物学者",
   "text": "ドイツ出身の医師。オランダ商館の医師として1823年に来日し、長崎の鳴滝塾で西洋医学を教えた。日本の植物や産物の研究も行った。"
  },
  "ogata": {
   "name": "緒方洪庵",
   "life": "1810〜1863",
   "role": "蘭方医",
   "text": "大坂の蘭方医。適塾を開いて多くの門人を育て、1849年に大坂除痘館を開いて牛痘種痘の普及に取り組んだ。"
  },
  "long": {
   "name": "クロフォード・ロング",
   "life": "1815〜1878",
   "role": "医師",
   "text": "アメリカ・ジョージア州の医師。1842年にエーテルを用いて手術を行ったが、報告したのは数年後だった。"
  },
  "wells": {
   "name": "ホレス・ウェルズ",
   "life": "1815〜1848",
   "role": "歯科医",
   "text": "アメリカの歯科医。笑気（亜酸化窒素）を用いた歯科での麻酔を試みた。"
  },
  "morton": {
   "name": "ウィリアム・モートン",
   "life": "1819〜1868",
   "role": "歯科医",
   "text": "アメリカの歯科医。1846年10月16日、ボストンでエーテル麻酔の公開実演を行い、麻酔が広く知られるきっかけとなった。"
  },
  "simpson": {
   "name": "ジェームズ・ヤング・シンプソン",
   "life": "1811〜1870",
   "role": "産科医",
   "text": "エディンバラの産科医。1847年にクロロホルムを麻酔に用い、その臨床での使用を広めた。"
  },
  "semmelweis_p": {
   "name": "ゼンメルワイス・イグナーツ",
   "life": "1818〜1865",
   "role": "産科医",
   "text": "ハンガリー出身の医師。ウィーンの産科で、さらし粉から作った塩素系の消毒液による手洗いによって、産褥熱の死亡率が低下することを示した。"
  },
  "buchheim_p": {
   "name": "ルドルフ・ブッフハイム",
   "life": "1820〜1879",
   "role": "薬理学者",
   "text": "ドイツ出身の薬理学者。ドルパト大学で、自宅の地下に設けた研究室で実験薬理学の研究と教育を始め、それはのちに大学の研究施設として整備された。"
  },
  "snow_p": {
   "name": "ジョン・スノウ",
   "life": "1813〜1858",
   "role": "医師",
   "text": "ロンドンの医師。1854年のコレラ流行で患者の分布と水源の関係を調べた。エーテルやクロロホルムによる麻酔の研究でも知られる。"
  },
  "perkin_p": {
   "name": "ウィリアム・ヘンリー・パーキン",
   "life": "1838〜1907",
   "role": "化学者",
   "text": "イギリスの化学者。1856年に紫色の合成染料モーブを得て、工業化した。"
  },
  "pasteur_p": {
   "name": "ルイ・パスツール",
   "life": "1822〜1895",
   "role": "化学者・微生物学者",
   "text": "フランスの化学者。発酵や腐敗に微生物が関わることを示し、のちに狂犬病などのワクチンの研究も行った。"
  },
  "niemann_p": {
   "name": "アルベルト・ニーマン",
   "life": "1834〜1861",
   "role": "化学者",
   "text": "ドイツの薬剤師・化学者。ゲッティンゲン大学でヴェーラーの講義を受け、のちにその助手となった。ヴェーラーの指導・助言のもとでコカの葉の研究を行い、1860年に純粋なコカインを単離して「コカイン」と名づけた。"
  },
  "lister_p": {
   "name": "ジョゼフ・リスター",
   "life": "1827〜1912",
   "role": "外科医",
   "text": "イギリスの外科医。石炭酸などを用いて手術後の感染を防ごうとする防腐法を報告し、外科に広めた。"
  },
  "schmiedeberg": {
   "name": "オスヴァルト・シュミーデベルク",
   "life": "1838〜1921",
   "role": "薬理学者",
   "text": "ブッフハイムのもとで学んだ薬理学者。シュトラスブルク大学で長く薬理学を教え、各国から集まった研究者に指導を行った。"
  },
  "kolbe": {
   "name": "ヘルマン・コルベ",
   "life": "1818〜1884",
   "role": "化学者",
   "text": "ドイツの化学者。1860年ごろサリチル酸の合成法を示し、のちに改良した。工業的な製造は、その方法をもとに弟子のフォン・ハイデンが1874年に始めた。"
  },
  "koch_p": {
   "name": "ロベルト・コッホ",
   "life": "1843〜1910",
   "role": "医師・細菌学者",
   "text": "ドイツの医師。炭疽菌の研究、1882年の結核菌の報告、1883〜1884年のエジプトとインドでのコレラの調査とコレラ菌の同定などで知られ、細菌を純粋に培養して調べる方法の整備に大きく寄与した。"
  },
  "knorr": {
   "name": "ルートヴィヒ・クノール",
   "life": "1859〜1921",
   "role": "化学者",
   "text": "ドイツの化学者。1883年にアンチピリンを合成した。"
  },
  "koller_p": {
   "name": "カール・コラー",
   "life": "1857〜1944",
   "role": "眼科医",
   "text": "ウィーンの眼科医。1884年にコカインを目の手術の局所麻酔に用いることを報告した。のちにアメリカで活動した。"
  },
  "nagai_p": {
   "name": "長井長義",
   "life": "1845〜1929",
   "role": "薬学者・化学者",
   "text": "ドイツで化学を学んだ薬学者。麻黄の研究を進め、1887年に純粋な結晶として得た成分をエフェドリンと名づけた。日本薬学会の初代会頭を務め、1880年の創立から1929年まで学会の発展に尽力した。"
  },
  "behring": {
   "name": "エミール・フォン・ベーリング",
   "life": "1854〜1917",
   "role": "医師・細菌学者",
   "text": "ドイツの医師。北里柴三郎らとともに抗毒素の研究を進め、ジフテリアの血清療法の研究で知られる。1901年に第1回ノーベル生理学・医学賞を受けた。"
  },
  "kitasato": {
   "name": "北里柴三郎",
   "life": "1853〜1931",
   "role": "医師・細菌学者",
   "text": "肥後出身の医師。ベルリンのコッホの研究所で、1889年に破傷風菌の純粋培養に成功し、1890年にベーリングとともに抗毒素の研究を発表した。1892年に帰国し、同年に設けられた大日本私立衛生会附属伝染病研究所の所長となった。"
  },
  "hoffmann": {
   "name": "フェリックス・ホフマン",
   "life": "1868〜1946",
   "role": "化学者",
   "text": "バイエル社の化学者。1897年にアセチルサリチル酸の医薬品化につながる合成に関わった。社内の他の人物の役割をめぐっては議論がある。"
  },
  "ehrlich": {
   "name": "パウル・エールリヒ",
   "life": "1854〜1915",
   "role": "医師・化学療法の研究者",
   "text": "ドイツの医師。化学物質で病原体を選択的に狙う化学療法の考えを進め、秦佐八郎らとともにサルバルサンを見いだした。免疫の研究で1908年にノーベル生理学・医学賞を受けた。"
  },
  "hata": {
   "name": "秦佐八郎",
   "life": "1873〜1938",
   "role": "細菌学者",
   "text": "島根出身の細菌学者。エールリヒの研究所で、多数の化合物の効果を動物実験で調べ、梅毒に有効な606号化合物の発見に重要な役割を果たした。"
  },
  "takamine": {
   "name": "高峰譲吉",
   "life": "1854〜1922",
   "role": "化学者・実業家",
   "text": "アメリカで活動した化学者。上中啓三との共同研究でアドレナリンの結晶化を進め、その成果を公表した。消化酵素剤タカジアスターゼでも知られる。"
  },
  "uenaka": {
   "name": "上中啓三",
   "life": "1876〜1960",
   "role": "化学者",
   "text": "高峰譲吉の研究室の化学者。1900年、副腎の抽出物からアドレナリンを結晶として取り出す実験を担った。"
  },
  "langley": {
   "name": "ジョン・ニューポート・ラングレー",
   "life": "1852〜1925",
   "role": "生理学者",
   "text": "イギリスの生理学者。神経の刺激や薬物を受け取る「受容物質」を想定し、受容体の考え方の源流の一つを示した。"
  },
  "suzuki_umetaro": {
   "name": "鈴木梅太郎",
   "life": "1874〜1943",
   "role": "農芸化学者",
   "text": "静岡出身の農芸化学者。米ぬかから脚気に関係する成分を研究し、1910年にオリザニンとして報告した。"
  },
  "funk": {
   "name": "カシミール・フンク",
   "life": "1884〜1967",
   "role": "生化学者",
   "text": "ポーランド出身の生化学者。1912年に「vitamine（ヴァイタミン）」という名称を提唱した。"
  },
  "banting": {
   "name": "フレデリック・バンティング",
   "life": "1891〜1941",
   "role": "医師",
   "text": "カナダの医師。トロント大学で膵臓の抽出物を用いたインスリンの研究を進めた。1923年にマクラウドとともにノーベル生理学・医学賞を受けた。"
  },
  "best": {
   "name": "チャールズ・ベスト",
   "life": "1899〜1978",
   "role": "医学研究者",
   "text": "トロント大学の学生として、バンティングとともにインスリンの研究を進めた。"
  },
  "collip": {
   "name": "ジェームズ・コリップ",
   "life": "1892〜1965",
   "role": "生化学者",
   "text": "カナダの生化学者。膵臓の抽出物を、患者に用いることのできる程度に精製する仕事に取り組んだ。"
  },
  "macleod": {
   "name": "ジョン・マクラウド",
   "life": "1876〜1935",
   "role": "生理学者",
   "text": "トロント大学の生理学の教授。研究の場を提供し、実験の計画にも関わった。1923年にバンティングとともにノーベル賞を受けた。"
  },
  "fleming": {
   "name": "アレクサンダー・フレミング",
   "life": "1881〜1955",
   "role": "細菌学者",
   "text": "スコットランド出身の細菌学者。1928年にアオカビの物質が細菌の生育を妨げることに気づき、ペニシリンと名づけて報告した。"
  },
  "florey": {
   "name": "ハワード・フローリー",
   "life": "1898〜1968",
   "role": "病理学者",
   "text": "オーストラリア出身の病理学者。オックスフォード大学で、ペニシリンを治療薬として実用化する研究を率いた。"
  },
  "chain": {
   "name": "エルンスト・チェイン",
   "life": "1906〜1979",
   "role": "生化学者",
   "text": "ドイツ出身の生化学者。オックスフォード大学で、ペニシリンの精製と性質の研究を進めた。1945年、フレミング、フローリーとともにノーベル賞を受けた。"
  },
  "heatley": {
   "name": "ノーマン・ヒートリー",
   "life": "1911〜2004",
   "role": "生化学者",
   "text": "オックスフォード大学の生化学者。ペニシリンを抽出し、生産する方法の工夫に重要な役割を果たした。"
  },
  "domagk": {
   "name": "ゲルハルト・ドーマク",
   "life": "1895〜1964",
   "role": "病理学者",
   "text": "ドイツの病理学者。プロントジルが細菌感染症に効くことを示した。1939年のノーベル生理学・医学賞の受賞者に選ばれた。"
  },
  "waksman": {
   "name": "セルマン・ワクスマン",
   "life": "1888〜1973",
   "role": "微生物学者",
   "text": "アメリカの微生物学者。土壌の微生物から抗生物質を探す研究を組織的に進め、ストレプトマイシンの研究を指導した。"
  },
  "schatz": {
   "name": "アルバート・シャッツ",
   "life": "1920〜2005",
   "role": "微生物学者",
   "text": "ワクスマンの研究室の大学院生として、土壌の放線菌からストレプトマイシンを分離した。"
  },
  "hodgkin": {
   "name": "ドロシー・ホジキン",
   "life": "1910〜1994",
   "role": "化学者",
   "text": "イギリスの化学者。X線結晶解析によって、ペニシリンやビタミンB12などの立体構造を明らかにした。1964年にノーベル化学賞を受けた。"
  },
  "bradford_hill": {
   "name": "オースティン・ブラッドフォード・ヒル",
   "life": "1897〜1991",
   "role": "統計学者・疫学者",
   "text": "イギリスの統計学者。MRCのストレプトマイシンの試験で、統計の方法と無作為の割り付けに重要な役割を果たした。"
  },
  "franklin": {
   "name": "ロザリンド・フランクリン",
   "life": "1920〜1958",
   "role": "化学者",
   "text": "イギリスの化学者。X線回折によるDNAの研究を行い、その結果は二重らせんモデルの重要な資料となった。"
  },
  "watson_crick": {
   "name": "ジェームズ・ワトソンとフランシス・クリック",
   "life": "1928〜2025／1916〜2004",
   "role": "分子生物学者",
   "text": "ワトソンとクリックは、1953年にDNAの二重らせんモデルを発表した。フランクリン、ウィルキンスらのX線回折の研究などが重要な資料となった。"
  },
  "kelsey": {
   "name": "フランシス・ケルシー",
   "life": "1914〜2015",
   "role": "薬理学者・審査官",
   "text": "カナダ出身の薬理学者。米国FDAの審査官として、サリドマイドの承認申請に対し、安全性のデータが不十分だとして承認を保留した。"
  },
  "lenz": {
   "name": "ヴィドゥキント・レンツ",
   "life": "1919〜1995",
   "role": "小児科医・遺伝学者",
   "text": "ドイツの医師。1961年、サリドマイドと胎児の障害との関係を指摘した。"
  },
  "black": {
   "name": "ジェームズ・ブラック",
   "life": "1924〜2010",
   "role": "薬理学者",
   "text": "スコットランド出身の薬理学者。受容体の考え方を背景に、プロプラノロールやシメチジンの開発を主導した。1988年にノーベル生理学・医学賞を受けた。"
  },

  const steps=[['経験（植物を試す）',[]],['化学療法と抗生物質',['chemotherapy','antibiotics']],['比較臨床試験と審査',['clinical_trial','regulation']],['薬害と安全対策',['pharmacovigilance','ev:thalidomide']],['分子生物学と創薬',['molecular_biology','rational_design']],['遺伝子組換えと抗体医薬',['recombinant','monoclonal']],['分子標的と免疫',['targeted_therapy','checkpoint']],['mRNAワクチン',['mrna_vaccine','ev:mrna_modified']]];
  const evs=EVENTS.filter(e=>S.ev[e.id]), reach=evs.length?Math.max.apply(null,evs.map(e=>e.year)):0;
  const nf=FACS.filter(f=>own(f.id)>0).length, nb=FACS.reduce((a,f)=>a+own(f.id),0);
  openMid('<div class="era-banner"><div class="t">現代編 CLEAR　全時代クリア</div><div class="n">薬学の歩み</div><div class="meta">あなたの薬学史</div></div>'+flowBand()+'<div class="recap">'+steps.map(s=>'<div><span class="c">'+(done(s[1])?'✓':'・')+'</span>'+s[0]+'</div>').join('')+'</div>'+
   '<div class="stat" style="margin:8px 0"><div>到達年代</div><div>'+fmtYear(reach)+'</div><div>発見した歴史</div><div>'+evs.length+' / '+EVENTS.length+'</div><div>研究した技術</div><div>'+TECHS.filter(t=>S.tech[t.id]).length+' / '+TECHS.length+'</div><div>建設した施設</div><div>'+nf+' / '+FACS.length+' 種（計'+nb+'基）</div><div>発見した薬物</div><div>'+DRUGS.filter(drugOn).length+' / '+DRUGS.length+'</div><div>人物図鑑</div><div>'+PEOPLE.filter(x=>S.met[x.id]).length+' / '+PEOPLE.length+'</div><div>総研究ポイント</div><div>'+fmt(S.techSpent)+'</div><div>総生産量</div><div>'+fmt(S.kpTotal)+'</div></div>'+
   '<p style="font-size:.76rem">20世紀、化学療法と抗生物質は感染症の治療を大きく変え、薬は比較臨床試験と審査の仕組みの中で評価されるようになりました。その一方で、薬害の経験は、安全性を確かめ、被害を救済する制度づくりを促す重要な契機の一つとなりました。分子生物学と生命工学は、抗体医薬や分子標的薬、mRNAワクチンといった新しい薬をもたらしています。文字すらなかった時代の小さな経験から始まった薬の歴史は、分子を理解し、設計し、生命の仕組みそのものを利用する時代へ到達しました。そして、その歩みはいまも続いています。</p><div class="note">取り残した研究や歴史、薬物は、続けて遊んでコンプリートできます。<br>※ ゲーム上の整理であり、実際の歴史が一本道だったわけではありません。薬の歴史は一本道ではなく、多くの人々と地域の、いくつもの流れが重なり合って進んできました。</div><button class="big" data-close-mid>続けて遊ぶ</button>'); S.clearShown=true; }
let toastT=0, toastCb=null;
let toastCur=null; // 表示中のキュー由来の通知（モーダルが開いたら、閉じたあとに出し直す）
function toastRaw(html,cb,dur,item){ const t=$('toast'); t.innerHTML=html; toastCb=cb||null; toastCur=item||null; t.classList.add('show'); clearTimeout(toastT);
  toastT=setTimeout(()=>{ t.classList.remove('show'); setTimeout(pumpN,NQ_GAP); },dur||3500); }
// 操作の反応（知識Pが足りません 等）：キューに入れず即時に表示する
function toast(msg,cb){ toastRaw(String(msg).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])),cb); }
/* 通知キュー：歴史・人物・理解段階・おかえりなさい。モーダル（時代開始・クリア等）やプロローグの表示中は保留し、
   閉じてから「理解段階（1件ずつ）→ 歴史（集約）→ 人物（集約）→ おかえりなさい」の順に出す */
const NQ_GAP=600; let nq=[];
const nHeld=()=>$('ovm').classList.contains('show')||!$('pro').hidden;
function notify(item){ nq.push(item); setTimeout(pumpN,0); } // 同じ処理の中で開くモーダルを待ってから判定する
function pumpN(){ if(!nq.length||nHeld()||$('toast').classList.contains('show')) return;
  // 後ろに通知が控えているときは表示を少し短くして、待ち時間を減らす
  const show=(html,cb,dur)=>toastRaw(html,cb,dur||(nq.length?2600:3500),{k:'again',html,cb,dur});
  const ai=nq.findIndex(x=>x.k==='again'); if(ai>=0){ const x=nq.splice(ai,1)[0]; show(x.html,x.cb,x.dur); return; }
  const take=k=>{ const xs=nq.filter(x=>x.k===k); nq=nq.filter(x=>x.k!==k); return xs; };
  const fi=nq.findIndex(x=>x.k==='flow');
  if(fi>=0){ const f=FLOW_BY[nq.splice(fi,1)[0].id]; show('🧭 薬の理解が〈'+f.name+'〉の段階へ<small>'+f.text+'</small>',()=>setTab('record')); return; }
  if(nq.some(x=>x.k==='ev')){ const t=[].concat(...take('ev').map(x=>x.t)); show(t.length===1?'📜 歴史が動いた：'+t[0]:'📜 歴史が'+t.length+'件動きました',()=>setTab('history')); return; }
  if(nq.some(x=>x.k==='per')){ const t=[].concat(...take('per').map(x=>x.t)); show(t.length===1?'👤 人物図鑑に登場：'+t[0]:'👤 人物図鑑に'+t.length+'人登場しました',()=>{codexSub='person';setTab('codex');}); return; }
  const w=take('w'); if(w.length) show(w[w.length-1].msg,null,4500); }

/* ---------- イベント ---------- */
document.addEventListener('click',e=>{
  const g=s=>e.target.closest(s);
  if(g('#proTap')){ proTap(); return; }
  if(g('#proGo')){ finishPrologue(); return; }
  if(g('#proSkip')){ finishPrologue(true); return; }
  if(g('[data-coach-x]')){ const id=$('coach').dataset.id; if(id){ S.tut[id]=1; save(); } coachUpdate(); return; }
  if(g('[data-pro-replay]')){ closeSheet(); showPrologue(true); return; }
  if(g('[data-pro]')){ proSheet(); return; }
  if(g('#tapBtn')){ const gn=tapGain(); S.kp+=gn; S.kpTotal+=gn; S.tapCount++; const r=$('tapBtn').getBoundingClientRect(); const d=document.createElement('div'); d.className='fl'; d.textContent='+'+fmt(gn); d.style.left=(r.left+r.width/2-10)+'px'; d.style.top=(r.top)+'px'; document.body.appendChild(d); setTimeout(()=>d.remove(),700); updateNums(); renderNav(); if(!S.tut.research) coachUpdate(); return; }
  if(g('#toast')&&toastCb){ const cb=toastCb; toastCb=null; $('toast').classList.remove('show'); cb(); return; }
  let el;
  if(g('[data-close]')||(e.target===$('ov'))){ closeSheet(); return; }
  if(g('[data-close-mid]')){ closeMid(); return; }
  if((el=g('nav button'))){ setTab(el.dataset.tab); return; }
  if((el=g('[data-tech]'))){ techSheet(el.dataset.tech); return; }
  if((el=g('[data-ev]'))){ navOpen('e',el.dataset.ev,true); return; }
  if((el=g('[data-drug]'))){ navOpen('d',el.dataset.drug,true); return; }
  if((el=g('[data-pnav]'))){ navOpen('p',el.dataset.pnav); return; }
  if((el=g('[data-dnav]'))){ navOpen('d',el.dataset.dnav); return; }
  if((el=g('[data-enav]'))){ navOpen('e',el.dataset.enav); return; }
  if(g('[data-nav-back]')){ navStack.pop(); navRender(); return; }
  if((el=g('[data-ptheme]'))){ peopleT=el.dataset.ptheme; peopleQ=''; peopleP='all'; peopleF='all'; closeSheet(); codexSub='person'; if(tab!=='codex') setTab('codex'); else renderAll(); window.scrollTo(0,0); return; }
  if((el=g('[data-do="research"]'))){ const id=el.dataset.id; if(research(id)) techSheet(id); else toast('知識Pが足りません'); return; }
  if((el=g('[data-sub]'))){ leaveCodex(); codexSub=el.dataset.sub; markCodexSeen(); renderAll(); return; }
  if((el=g('[data-pregion]'))){ peopleF=el.dataset.pregion; renderAll(); return; }
  if((el=g('[data-person]'))){ navOpen('p',el.dataset.person,true); return; }
  if((el=g('[data-region]'))){ regionF=el.dataset.region; renderAll(); return; }
  if((el=g('[data-qty]'))){ qty=el.dataset.qty==='max'?'max':+el.dataset.qty; renderAll(); return; }
  if((el=g('[data-buy]'))){ if(!buy(el.dataset.buy)) toast('知識Pが足りません'); return; }
  if((el=g('[data-up]'))){ if(!buyUp(el.dataset.up)) toast('知識Pが足りません'); return; }
  if(g('#recapBtn')){ showClear(); return; }
  if(g('#medBtn')){ showMed(); return; }
  if(g('#kinBtn')){ showKinsei(); return; }
  if(g('#kdBtn')){ showKindai(); return; }
  if(g('#expBtn')){ $('code').value=exportCode(); $('code').select(); return; }
  if(g('#impBtn')){ if(!importCode($('code').value)) toast('コードを読み込めませんでした'); else toast('読み込みました'); return; }
  if(g('#resetBtn')){ openMid('<h3>セーブデータをリセット</h3><p>進行状況をすべて消して最初からやり直します。よろしいですか？</p><div style="display:flex;gap:8px"><button class="big off" data-close-mid>やめる</button><button class="big" id="resetYes" style="background:#ff6b8a">リセットする</button></div>'); return; }
  if(g('#resetYes')){ safe(()=>localStorage.removeItem(SAVE_KEY)); S=newState(); queue.length=0; recalc(); closeMid(); renderAll(); showPrologue(); return; }
});

/* ---------- ループ ---------- */
let last=performance.now(), acc=0, lastRenderKey='', hiddenAt=0;
function grantOffline(sec){ if(!(sec>=OFF_MIN)||PROD<=0) return; const t=Math.min(sec,OFF_MAX), g=PROD*t*OFF_EFF; S.kp+=g; S.kpTotal+=g;
  const h=Math.floor(sec/3600), mi=Math.floor(sec%3600/60);
  notify({k:'w',msg:'おかえりなさい。留守の'+(h?h+'時間':'')+mi+'分で '+fmt(g)+' の知識Pを得ました（生産量の'+Math.round(OFF_EFF*100)+'%'+(sec>OFF_MAX?'・最大'+(OFF_MAX/3600)+'時間分':'')+'）'}); }
// 留守の時間は「最後に画面を見ていた時刻」から一度だけ数える（復帰の経路が重なっても二重に加算しない）
let activeAt=Date.now();
function claimAway(){ const now=Date.now(), sec=(now-activeAt)/1000; activeAt=now; grantOffline(sec); }
function tick(){ const now=performance.now(); let dt=(now-last)/1000; last=now; if(dt<0) dt=0;
  if(document.hidden) return; // 画面を離れている間は数えず、戻ったときにまとめて計算する
  if(Date.now()-activeAt>5000){ claimAway(); dt=0; } // スリープ等で止まっていた場合
  activeAt=Date.now();
  S.kp+=PROD*dt; S.kpTotal+=PROD*dt; S.playSec+=dt; acc+=dt;
  updateNums(); if(acc>=1){ acc=0; renderNav(); } }
setInterval(tick,100);
setInterval(save,5000);
document.addEventListener('visibilitychange',()=>{ if(document.hidden) save(); else { claimAway(); last=performance.now(); } });
window.addEventListener('pagehide',save);
document.addEventListener('dblclick',e=>e.preventDefault());
// 人物図鑑の検索・絞り込み：一覧部分だけ描き直す（入力欄のフォーカスを保つ）
document.addEventListener('input',e=>{ if(e.target.id==='pq'){ peopleQ=e.target.value; const l=$('plist'); if(l) l.innerHTML=peopleList(); } });
document.addEventListener('change',e=>{ const id=e.target.id; if(!['pp','pt','pr'].includes(id)) return;
  if(id==='pp') peopleP=e.target.value; else if(id==='pt') peopleT=e.target.value; else peopleF=e.target.value; const l=$('plist'); if(l) l.innerHTML=peopleList(); });
{ const w=checkPeopleNet(); if(w.length) console.warn('[人物データの確認] '+w.length+'件\n'+w.join('\n')); }

load(); recalc(); progress(true);
if(S.lastSeen){ activeAt=S.lastSeen; claimAway(); }
if(S.era>=6&&!S.medShown) queue.push({k:'med'});
if(S.era>=8&&!S.kinShown) queue.push({k:'kin'});
if(S.era>=10&&!S.kdShown) queue.push({k:'kd'});
if(S.eraShown<S.era) queue.push({k:'era',era:S.era});
if(S.cleared&&!S.clearShown) queue.push({k:'clear'});
renderAll(); runQueue();
if(!S.prologueDone) showPrologue();
window.__game={DRUGS,PEOPLE,techCost,S:()=>S,research,buy,buyUp,progress,recalc,renderAll,tick,setTab,TECHS,FACS,EVENTS,setQty:q=>{qty=q;},giveKp:n=>{S.kp+=n;},checkPeopleNet,P,get PROD(){return PROD;},reset:()=>{safe(()=>localStorage.removeItem(SAVE_KEY));}};
})();
</script>
