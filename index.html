.pro-tag{font-size:.66rem;letter-spacing:.42em;color:var(--acc2);font-weight:900;text-align:center;margin-top:4vh;}
.pro h1{font-size:1.9rem;font-weight:900;text-align:center;margin:10px 0 4px;letter-spacing:.08em;}
.pro-when{text-align:center;color:var(--acc);font-weight:800;font-size:.9rem;margin-bottom:14px;}
.pro-lead{font-size:.82rem;line-height:2;text-align:center;color:var(--mute);margin:0 0 18px;}
.pro-stage{flex:1;display:flex;flex-direction:column;align-items:center;gap:14px;transition:opacity .5s;}
.pro-kp{display:flex;flex-direction:column;align-items:center;animation:proIn .5s ease;}
.pro-kp b{font-size:2rem;color:#c9d6e4;font-variant-numeric:tabular-nums;line-height:1;}
.pro-kp small{font-size:.66rem;color:var(--mute);margin-top:2px;}
.pro-btn{width:190px;height:190px;border-radius:50%;border:0;font-weight:900;font-size:1.15rem;color:#1c1f23;
 background:radial-gradient(circle at 40% 32%,#c9d6e4,#9fb4cb 50%,#7790ab);box-shadow:0 0 0 10px rgba(143,166,191,.08),0 0 40px rgba(143,166,191,.25),0 6px 0 #56687c;
 animation:proGlow 2.4s ease-in-out infinite;}
.pro-btn:active{transform:translateY(4px);box-shadow:0 0 0 10px rgba(143,166,191,.08),0 2px 0 #56687c;}
.pro-btn:disabled{opacity:.4;animation:none;}
.pro-dots{display:flex;gap:8px;}
.pro-dots i{width:9px;height:9px;border-radius:50%;background:rgba(200,210,225,.18);transition:background .3s;}
.pro-dots i.on{background:var(--acc);}
.pro-log{min-height:5.4em;width:100%;text-align:center;font-size:.84rem;line-height:1.8;}
.pro-log div{animation:proIn .6s ease;color:#7f8790;}
.pro-log div:last-child{color:var(--tx);}
.pro-def{width:100%;background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:12px;padding:10px 14px;font-size:.78rem;line-height:1.7;animation:proIn .6s ease;}
.pro-def b{color:var(--acc);}
.pro-card{background:#2b2f35;border:1px solid rgba(143,166,191,.5);border-radius:18px;padding:20px 18px;margin-top:6px;
 box-shadow:0 10px 40px rgba(0,0,0,.45);animation:proCard .8s cubic-bezier(.2,.8,.2,1);}
.pro-card .t{font-size:.62rem;letter-spacing:.2em;color:var(--acc2);font-weight:900;}
.pro-card h2{margin:6px 0 2px;font-size:1.45rem;}
.pro-card h4{margin:0 0 4px;font-size:.84rem;color:var(--acc);}
.pro-card .meta{font-size:.66rem;color:var(--mute);margin-bottom:6px;}
.pro-card p{font-size:.8rem;line-height:1.9;margin:8px 0;}
.pro-card .box{background:rgba(255,255,255,.07);border-radius:10px;padding:8px 10px;font-size:.74rem;line-height:1.6;margin:10px 0;}
.pro-card .box b{color:var(--acc);}
.pro-close{text-align:center;font-weight:900;font-size:.9rem;margin:14px 0 4px;color:#c9d6e4;line-height:1.7;}
.pro-go{width:100%;border:0;border-radius:12px;padding:14px;font-weight:900;font-size:1rem;color:#1c1f23;margin-top:8px;
 background:linear-gradient(#9fb4cb,#7790ab);box-shadow:0 4px 0 #56687c;}
.pro-go:active{transform:translateY(2px);box-shadow:0 2px 0 #56687c;}
.pro-skip{background:none;border:0;color:#6c737b;font-size:.66rem;margin:16px auto 0;padding:6px 12px;text-decoration:underline;}
.fl.pro-fl{z-index:80;color:#c9d6e4;font-size:1rem;}
.toast small{display:block;font-weight:700;font-size:.68rem;opacity:.9;margin-top:2px;}
/* 動きを減らす設定：装飾的な動きは止め、操作の反応は小さく残す */
@media (prefers-reduced-motion: reduce){
 .pro-btn{animation:none;}
 .tut-hi{animation:none;box-shadow:0 0 0 2px #c2a46a;}
 .pro-kp,.pro-log div,.pro-def,.pro-card,.coach{animation:none;}
 .pro{transition:opacity .25s ease;}
 .pro-stage{transition:none;}
 .toast{transition:opacity .15s;transform:translate(-50%,0);}
 .bar i{transition:width .1s;}
 .fl{animation:flr .7s ease-out forwards;}
}
@keyframes flr{to{transform:translateY(-12px);opacity:0;}}
@keyframes proIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}
@keyframes proCard{from{opacity:0;transform:translateY(24px) scale(.97);}to{opacity:1;transform:none;}}
@keyframes proGlow{50%{box-shadow:0 0 0 18px rgba(143,166,191,.04),0 0 60px rgba(143,166,191,.38),0 6px 0 #56687c;}}
/* 薬の理解の歩み（経験 → … → 遺伝子・免疫） */
.flowband{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:4px 2px;margin:8px 0 10px;font-size:.6rem;}
.flowband span{padding:2px 7px;border-radius:99px;border:1px solid var(--line);color:var(--mute);}
.flowband span.on{background:rgba(143,166,191,.16);border-color:rgba(143,166,191,.6);color:var(--acc);font-weight:800;}
.flowband span.now{background:var(--acc);color:#1c1f23;border-color:var(--acc);font-weight:900;}
.flowband i{font-style:normal;color:var(--acc);opacity:.6;}
/* ===== 段階チュートリアル（コーチ） ===== */
/* ===== エンディング：黒地に文字だけ。演出は文字・余白・スクロール距離で行う ===== */
.ending{--e-bg:#050505;--e-tx:#e6e4df;--e-mute:#8c8a84;--e-faint:#4a4945;--e-gold:#c9a45c;--e-line:#262523;
 --e-mono:ui-monospace,"SFMono-Regular",Menlo,Consolas,"Liberation Mono",monospace;
 position:fixed;inset:0;z-index:90;background:var(--e-bg);color:var(--e-tx);overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;
 font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;}
.end-x{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));right:12px;z-index:2;background:none;border:1px solid var(--e-line);border-radius:6px;color:var(--e-faint);font:inherit;font-size:.64rem;padding:5px 9px;}
.end-x:focus-visible{outline:1px solid var(--e-gold);color:var(--e-mute);}
.end-in{max-width:440px;margin:0 auto;padding:0 24px calc(40px + env(safe-area-inset-bottom,0px));}
.end-sec{min-height:100dvh;display:flex;flex-direction:column;justify-content:center;padding:72px 0 40px;box-sizing:border-box;}
.end-sec.short{min-height:auto;padding:96px 0;}
.end-k{font-family:var(--e-mono);font-size:.68rem;letter-spacing:.32em;color:var(--e-mute);text-align:center;margin:0 0 14px;}
.end-title{font-family:var(--e-mono);font-size:2rem;letter-spacing:.18em;text-align:center;margin:0;font-weight:400;}
.end-gold{color:var(--e-gold);}
.end-big{font-family:var(--e-mono);font-size:1.6rem;font-weight:400;letter-spacing:.4em;text-align:center;margin:6px 0 38px;padding-left:.4em;}
.end-p{font-size:.84rem;line-height:2.05;margin:0 0 14px;text-align:center;}
.end-p.mute{color:var(--e-mute);}
.end-p .ph{display:inline-block;} /* 読点の位置で改行し、語の途中で折り返さない */
.end-scroll{font-family:var(--e-mono);font-size:.62rem;letter-spacing:.3em;color:var(--e-faint);text-align:center;margin-top:44px;}
.end-h{font-family:var(--e-mono);font-size:.8rem;letter-spacing:.34em;text-align:center;margin:0 0 26px;font-weight:400;}
.end-rule{border:0;border-top:1px solid var(--e-line);margin:0 0 6px;}
.end-rec{display:grid;grid-template-columns:auto 1fr auto;align-items:baseline;gap:0 10px;font-size:.8rem;padding:9px 0;border-bottom:1px solid var(--e-line);}
.end-rec span:first-child{color:var(--e-mute);}
.end-rec i{border-bottom:1px dotted var(--e-faint);transform:translateY(-4px);}
.end-rec b{font-family:var(--e-mono);font-weight:400;font-variant-numeric:tabular-nums;text-align:right;}
.end-cr{text-align:center;margin:0 0 34px;}
.end-cr small{display:block;font-family:var(--e-mono);font-size:.6rem;letter-spacing:.3em;color:var(--e-mute);margin-bottom:8px;}
.end-cr div{font-size:.9rem;line-height:1.9;}
.end-blank{height:230dvh;display:flex;align-items:center;justify-content:center;color:var(--e-faint);font-family:var(--e-mono);letter-spacing:.4em;}
.end-soon{border-top:1px solid var(--e-gold);border-bottom:1px solid var(--e-gold);padding:30px 0 26px;}
.end-list{list-style:none;margin:22px 0 0;padding:0;text-align:center;}
.end-list li{font-size:.86rem;line-height:2.3;color:var(--e-faint);letter-spacing:.12em;}
.end-list li.open{color:var(--e-tx);}
.end-list li.more{font-size:.7rem;letter-spacing:.06em;margin-top:6px;}
.end-go{display:block;margin:34px auto 0;font:inherit;font-size:.86rem;color:var(--e-bg);background:var(--e-tx);border:0;border-radius:4px;padding:12px 30px;letter-spacing:.1em;}
.end-go:focus-visible{outline:2px solid var(--e-gold);outline-offset:3px;}
.coach{position:fixed;left:12px;right:12px;margin:0 auto;bottom:calc(var(--nav-h) + 10px);z-index:35;max-width:496px;
 background:#3a4a5c;border:1px solid #8fa6bf;border-radius:14px;padding:10px 36px 10px 12px;font-size:.74rem;line-height:1.6;box-shadow:0 6px 20px rgba(0,0,0,.4);animation:proIn .4s ease;}
.coach b{color:#dfe5ec;}
.coach small{color:#c4ccd5;font-size:.64rem;}
.coach .cx{position:absolute;top:6px;right:8px;background:none;border:0;color:#c4ccd5;font-size:.95rem;}
.tut-hi{animation:tutHi 1.4s ease-in-out infinite;position:relative;z-index:1;}
@keyframes tutHi{50%{box-shadow:0 0 0 3px #c2a46a,0 0 18px rgba(194,164,106,.7);}}
nav button.tut-hi{border-radius:12px;}
.app{transition:opacity .2s;}
/* ===== 専門史「薬害から医薬品安全へ」：エンディングと同じ黒地・白文字・金のアクセント。資料館の端末のように静かに ===== */
.sf{--e-bg:#050505;--e-tx:#e6e4df;--e-mute:#8c8a84;--e-faint:#4a4945;--e-gold:#c9a45c;--e-line:#262523;
 --e-mono:ui-monospace,"SFMono-Regular",Menlo,Consolas,"Liberation Mono",monospace;--sf-pan:#121211;--sf-pan2:#1a1918;
 --sf-dis:#c49a86;--sf-sig:#c9a45c;--sf-sys:#8fbcae;
 position:fixed;inset:0;z-index:85;background:var(--e-bg);color:var(--e-tx);display:flex;flex-direction:column;
 font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;}
.sf[hidden]{display:none!important;}
html.sf-open,html.sf-open body{overflow:hidden;}
.sf-top{flex:none;display:flex;align-items:center;gap:10px;padding:calc(8px + env(safe-area-inset-top,0px)) 12px 8px;border-bottom:1px solid var(--e-line);max-width:560px;width:100%;margin:0 auto;}
.sf-back{flex:none;background:none;border:1px solid var(--e-line);border-radius:6px;color:var(--e-mute);font:inherit;font-size:.66rem;padding:6px 9px;min-height:34px;}
.sf-ttl{flex:1;min-width:0;font-size:.72rem;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.sf-ttl small{display:block;font-family:var(--e-mono);font-size:.56rem;letter-spacing:.24em;color:var(--e-gold);}
.sf-kp{flex:0 1 auto;max-width:38%;min-width:0;text-align:right;line-height:1.1;overflow:hidden;}
.sf-kp b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.sf-kp b{font-family:var(--e-mono);font-weight:400;font-size:.9rem;font-variant-numeric:tabular-nums;}
.sf-kp small{display:block;font-size:.56rem;color:var(--e-mute);}
.sf-scroll{flex:1;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;}
.sf-in{max-width:560px;margin:0 auto;padding:12px 16px calc(28px + env(safe-area-inset-bottom,0px));overflow-wrap:anywhere;}
.sf-nav{flex:none;border-top:1px solid var(--e-line);background:#0a0a0a;padding-bottom:env(safe-area-inset-bottom,0px);}
.sf-nav .in{max-width:560px;margin:0 auto;display:flex;}
.sf-nav button{flex:1;min-width:0;background:none;border:0;color:var(--e-mute);font:inherit;font-size:.6rem;padding:8px 2px 7px;display:flex;flex-direction:column;align-items:center;gap:2px;min-height:48px;}
.sf-nav button b{font-family:var(--e-mono);font-weight:400;font-size:.54rem;letter-spacing:.12em;}
.sf-nav button.on{color:var(--e-gold);box-shadow:inset 0 2px 0 var(--e-gold);}
.sf.sf-full .sf-nav{display:none;}
.sf-k{font-family:var(--e-mono);font-size:.6rem;letter-spacing:.2em;color:var(--e-gold);}
.sf-mute{color:var(--e-mute);font-size:.74rem;line-height:1.7;}
.sf-hero{padding:14px 2px 6px;}
.sf-hero h1{font-size:1.3rem;margin:8px 0 2px;font-weight:700;letter-spacing:.06em;}
.sf-en{font-family:var(--e-mono);font-size:.6rem;letter-spacing:.16em;color:var(--e-mute);margin-bottom:10px;}
.sf-hero p{font-size:.8rem;line-height:1.9;margin:6px 0;}
.sf-hero p.sf-mute{font-size:.72rem;}
.sf-gap{border:1px solid var(--e-line);background:var(--sf-pan);border-radius:8px;padding:10px 12px;margin:12px 0;}
.sf-bar{display:grid;grid-template-columns:8.6em 1fr;align-items:center;gap:8px;margin:3px 0;}
.sf-bar span{font-family:var(--e-mono);font-size:.54rem;letter-spacing:.08em;color:var(--e-mute);}
.sf-bar div{height:8px;background:#222120;border-radius:2px;overflow:hidden;}
.sf-bar i{display:block;height:100%;background:#8c8a84;transition:width .4s;}
.sf-bar.sys i{background:var(--e-gold);}
.sf-gapl{display:flex;justify-content:space-between;align-items:baseline;margin-top:8px;border-top:1px solid var(--e-line);padding-top:7px;}
.sf-gapl span{font-family:var(--e-mono);font-size:.6rem;letter-spacing:.16em;color:var(--e-mute);}
.sf-gapl b{font-family:var(--e-mono);font-weight:400;font-size:.78rem;letter-spacing:.1em;}
.sf-gap-high .sf-gapl b{color:#e0a089;}
.sf-gap-low .sf-gapl b{color:var(--sf-sys);}
.sf-gapm{font-size:.68rem;line-height:1.7;color:var(--e-mute);margin-top:4px;}
.sf-ch{width:100%;display:grid;grid-template-columns:2.6em 1fr auto;gap:10px;align-items:center;text-align:left;background:var(--sf-pan);border:1px solid var(--e-line);border-radius:8px;padding:11px 12px;margin:0 0 7px;color:var(--e-tx);font:inherit;min-height:56px;}
.sf-ch b{display:block;font-size:.88rem;}
.sf-ch small{display:block;font-size:.64rem;color:var(--e-mute);line-height:1.6;}
.sf-ch em{font-style:normal;font-family:var(--e-mono);font-size:.58rem;letter-spacing:.08em;color:var(--e-mute);white-space:nowrap;}
.sf-ch.cur{border-color:rgba(201,164,92,.55);}
.sf-ch.cur em{color:var(--e-gold);}
.sf-ch.off{opacity:.45;}
.sf-no{display:flex;align-items:center;justify-content:center;height:2.4em;border:1px solid var(--e-gold);color:var(--e-gold);border-radius:4px;font-family:Georgia,"Times New Roman",serif;font-size:.8rem;}
.sf-nob{width:2.8em;height:2.8em;flex:none;font-size:1rem;}
.sf-chh{display:flex;gap:12px;align-items:center;margin:6px 0 10px;}
.sf-chh h2{margin:4px 0 0;font-size:1.15rem;}
.sf-chh small{color:var(--e-mute);font-size:.66rem;}
.sf-note{border:1px dashed var(--e-faint);border-radius:6px;padding:7px 10px;font-size:.72rem;color:var(--e-tx);margin:6px 0 10px;}
.sf-intro{border-left:2px solid var(--e-gold);padding:2px 0 2px 12px;margin:8px 0 6px;}
.sf-intro p{font-size:.8rem;line-height:1.95;margin:0 0 8px;}
.sf-dev{font-family:var(--e-mono);font-size:.58rem;letter-spacing:.06em;color:var(--e-mute);}
.sf-sec{font-family:var(--e-mono);font-size:.66rem;letter-spacing:.16em;color:var(--e-gold);margin:20px 2px 8px;}
.sf-sec small{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif;letter-spacing:0;color:var(--e-mute);margin-left:6px;}
.sf-erah{font-size:.72rem;font-weight:700;margin:16px 2px 6px;}
.sf-erah small{font-weight:400;color:var(--e-mute);margin-left:6px;}
.sf-card{background:var(--sf-pan);border:1px solid var(--e-line);border-radius:8px;padding:11px 12px;font-size:.8rem;line-height:1.7;}
.sf-card>b{display:block;font-size:.92rem;}
.sf-fict{display:inline-block;font-family:var(--e-mono);font-size:.58rem;letter-spacing:.08em;color:var(--e-tx);border:1px solid var(--e-faint);border-radius:4px;padding:2px 7px;margin-bottom:6px;}
.sf-ok,.sf-okt{color:var(--sf-sys);font-size:.74rem;}
.sf-btn{display:block;width:100%;border:0;border-radius:6px;padding:13px 12px;min-height:48px;font:inherit;font-weight:700;font-size:.86rem;background:var(--e-tx);color:#0a0a0a;margin-top:10px;letter-spacing:.04em;}
.sf-btn small{display:block;font-weight:400;font-size:.64rem;opacity:.8;margin-top:2px;}
.sf-btn.sub{background:none;color:var(--e-tx);border:1px solid var(--e-faint);}
.sf-btn.off{background:#2a2928;color:#7a7873;}
.sf-link{background:none;border:0;color:var(--e-mute);font:inherit;font-size:.7rem;padding:10px 0;min-height:40px;}
.sf-row{width:100%;display:grid;grid-template-columns:5em 1fr auto;gap:8px;align-items:center;text-align:left;background:var(--sf-pan);border:1px solid var(--e-line);border-radius:6px;padding:9px 10px;margin:0 0 6px;color:var(--e-tx);font:inherit;min-height:52px;}
.sf-row b{display:block;font-size:.82rem;line-height:1.45;}
.sf-row small{display:block;font-size:.62rem;color:var(--e-mute);}
.sf-row i{font-style:normal;color:var(--e-mute);font-size:.66rem;white-space:nowrap;}
.sf-row.new{border-color:rgba(201,164,92,.5);}
.sf-row.new i{color:var(--e-gold);}
.sf-row.off{opacity:.45;}
.sf-yr{font-family:var(--e-mono);font-size:.56rem;color:var(--e-mute);line-height:1.35;}
.sf-type{display:inline-flex;gap:5px;align-items:baseline;font-size:.58rem;border:1px solid;border-radius:3px;padding:1px 6px;margin:3px 5px 0 0;line-height:1.5;}
.sf-type b{font-family:var(--e-mono);font-weight:400;font-size:.52rem;letter-spacing:.08em;display:inline;}
.sf-type-disaster{color:var(--sf-dis);border-color:rgba(196,154,134,.55);}
.sf-type-signal{color:var(--sf-sig);border-color:rgba(201,164,92,.55);}
.sf-type-system{color:var(--sf-sys);border-color:rgba(143,188,174,.55);}
.sf-bio{color:var(--e-tx);border-color:var(--e-faint);}
.sf-legend{margin:0 2px 6px;}
.sf-tech{background:var(--sf-pan);border:1px solid var(--e-line);border-radius:8px;padding:11px 12px;margin:0 0 8px;}
.sf-tech b{display:block;font-size:.9rem;margin:3px 0 1px;}
.sf-tech.own{border-color:rgba(143,188,174,.45);}
.sf-tech.off{opacity:.5;}
.sf-eff{font-size:.74rem;line-height:1.7;margin-top:6px;}
.sf-exam{font-size:.66rem;color:var(--e-mute);margin-top:3px;}
.sf-tri{border:1px solid rgba(201,164,92,.45);border-radius:8px;padding:10px 12px;margin:0 0 12px;}
.sf-tri-in{display:flex;align-items:center;justify-content:space-between;gap:4px;margin:8px 0 6px;text-align:center;}
.sf-tri-in div{flex:1;border:1px solid var(--e-faint);border-radius:6px;padding:7px 2px;}
.sf-tri-in b{display:block;font-size:.82rem;}
.sf-tri-in small{font-family:var(--e-mono);font-size:.56rem;color:var(--e-mute);}
.sf-tri-in i{font-style:normal;color:var(--e-gold);}
.sf-tl{border-left:1px solid var(--e-faint);margin-left:8px;padding-left:10px;}
.sf-tli{position:relative;width:100%;display:grid;grid-template-columns:6.2em 1fr;gap:8px;text-align:left;background:none;border:0;border-bottom:1px solid var(--e-line);padding:9px 0;color:var(--e-tx);font:inherit;min-height:48px;}
.sf-tli::before{content:"";position:absolute;left:-14px;top:15px;width:7px;height:7px;border-radius:50%;background:var(--e-faint);}
.sf-tli.t-disaster::before{background:var(--sf-dis);}
.sf-tli.t-signal::before{background:var(--sf-sig);}
.sf-tli.t-system::before{background:var(--sf-sys);}
.sf-tli b{display:block;font-size:.8rem;}
.sf-tli small{display:block;font-size:.58rem;color:var(--e-mute);}
.sf-tli.off{opacity:.4;}
.sf-tli.oath{opacity:.75;}

  "separation": "診断・処方する医師と、薬を調製する者の役割を、制度の上で区別しようとする考え方。13世紀のシチリア王国の法令は、そうした制度的な動きの一例とされる。地域によって形や時期は大きく異なり、現代の医薬分業とそのまま同じではない。",
  "iatro_prelude": "錬金術の実験技術を医療に応用する発想が生まれる。蒸留で得たアルコールを薬とみなす考えなどが、のちの医化学への前段階となった。",
  "pharmacopoeia": "薬の処方・品質・調製法を、公的な権威のもとで定めた規範。誰がどこで調剤しても同じ薬になることを目指したもので、15世紀末のフィレンツェの『リチェッタリオ』は、その初期の重要な例とされる。",
  "exotic_survey": "大航海を通じて、インドや新大陸の薬物が記録され、ヨーロッパへ紹介された。ゴアのオルタやセビリアのモナルデスのように、遠い土地の薬を見聞にもとづいて書き残す医師たちが現れた。",
  "field_herbal": "古典の記述だけでなく、実物の観察に基づいて薬草を記録する動きが広がった。印刷された挿絵が、離れた場所の人々にとっても植物を見分ける手がかりになった。",
  "honzo_systematize": "東アジアで、薬物を分類・整理した大部の本草書がまとめられた。明の『本草綱目』はその代表で、書物とともに日本など周辺の地域へも伝わった。",
  "bark_trial": "南米由来の樹皮（キナ皮）がヨーロッパに伝わり、熱病の薬として使われるようになった。この段階では樹皮そのものを薬として用いており、成分を取り出すのは19世紀の仕事になる。",
  "botanic_garden": "薬草園が、薬草を育てるだけでなく、研究・教育・標本収集の場にもなっていった。ロンドンのチェルシー薬草園や江戸の小石川御薬園のように、各地で薬草園が整えられた。",
  "iatrochemistry": "化学的な物質を医療に用いる考え方。16世紀のパラケルススが鉱物や金属の薬を説き、ガレノス流の医学との論争を呼んだ。のちの化学的な薬剤の調製につながっていく。",
  "chem_remedies": "鉱物・金属などを用いた薬剤が調製され、一部は薬局方にも載るようになった。アンチモンや水銀の薬のように、毒性と有用性をめぐる議論が長く続いた。",
  "opium_prep": "アヘンを含む製剤が整理され、処方に使われた。17世紀のシデナムが用いたアヘンチンキ（ラウダヌム）はその一例で、鎮痛や鎮静に用いられた。",
  "chem_analysis": "物質の性質や反応を観察し、精製・分析する化学が進んだ。植物から作用のある部分を取り出す試みは古くからあったが、特定の有効成分を純粋な結晶として単離するのは19世紀以降のことで、ここではまだその手前の段階にあたる。",
  "city_dispensatory": "ニュルンベルクなどの都市が、調剤書を公的な基準として用いた。都市ごとに定められた調剤書は、薬局が同じ処方で薬をつくるための拠り所となった。",
  "guild_apothecary": "ロンドンで薬剤師が食料品商組合から分離・独立し、固有の団体を持った。団体は徒弟の育成などを通じて、薬剤師の職能を支える場となった。",
  "national_pharma": "ロンドン、パリ、エディンバラなどで、医師団体などの関与のもとに薬局方が作られた。化学的な薬剤をどう載せるかは、薬局方の内容をめぐる論点の一つになった。",
  "apothecary_practice": "診察・助言・処方・調剤を行う薬剤師の実務が、医師側との対立の中で形づくられていった（英国）。1704年のローズ事件の判決は、薬剤師の実務をめぐる重要な法的先例となった。",
  "drug_trade": "輸入薬種の検査・集散が、仲間などの組織によって制度化された。大坂・道修町では、長崎から入った唐薬種が検査を経て全国へ送り出された。",
  "print_drug_books": "印刷が、薬物書や薬局方を広い範囲に流通させた。手で写すよりはるかに多くの同じ内容の本が出回り、挿絵や処方を各地で共有できるようになった。",
  "specimen_meeting": "各地の産物を集めて展示・鑑定する会が開かれ、本草学の裾野が広がった。江戸では平賀源内らの物産会（薬品会）が知られる。",
  "clinical_obs": "病気の経過や薬の効き方を、症例の観察と記録で捉える見方が広がった。17世紀イングランドのシデナムは、病気をよく観察して記録することを重んじた。",
  "clinical_dose": "症例記録をもとに、用量・効果・副作用を検討する試みが現れた。ウィザリングはジギタリスを用いた多くの症例を記録し、調製法や量を検討した。",
  "treatment_compare": "複数の治療法を比べて検討する試みが現れた。リンドが壊血病の患者を組に分けて治療を比べた例は、その重要な一例とされる。",
  "alkaloid_isolation": "植物から、作用の強い成分（アルカロイド）を結晶として取り出す。生薬に含まれる特定の成分を取り出し、その性質や量を個別に扱えるようになる流れの一つ。19世紀初めのモルヒネやキニーネの単離がその代表例。",
  "crude_drug_quality": "生薬に含まれる成分の量で、品質を比べようとする考え方が広がる。産地や見た目による鑑定に、化学的な分析が加わっていく。",
  "plant_chem_japan": "日本で、伝統的に使われてきた生薬の成分を化学的に調べる研究が進む。麻黄からのエフェドリンの単離は、その重要な成果の一つ。",
  "organic_chem": "生き物に由来する物質の成り立ちを化学的に調べ、組み立てる学問。19世紀には大学の研究室で多くの化学者が育ち、のちの合成化学の土台となった。",
  "inhal_anesthesia": "エーテルやクロロホルムなどを吸わせて、手術中の痛みを取り除く方法。1840年代に各地で試みられ、外科手術のあり方を大きく変えた。",
  "industrial_pharma": "単離した成分などを、品質をそろえて製造し、販売する。薬局や化学実験室で行われていた医薬品成分の製造が、次第に工業的な規模へ広がっていく。",
  "synthetic_dyes": "コールタールなどを原料に、染料を化学的に合成する工業が興る。有機化学の研究と、大規模な化学工業の発展を示す流れ。",
  "synthetic_drugs": "生薬から得られる物質だけでなく、化学的に合成した物質そのものを医薬品として利用する流れ。19世紀後半には、催眠薬や解熱薬などの合成医薬品が登場した。",
  "local_anesthesia": "体の一部だけの感覚を止めて処置を行う方法。1880年代に、コカインを目の手術に用いる方法が報告され、広まった。",
  "national_pharmacopoeia": "都市ごとの薬局方とは別に、国全体で共通に使う薬局方を定める。19世紀には、国のレベルで薬の品質や調製の基準を定める薬局方が、各国で整備されていった。",
  "pharm_education": "薬剤師を、徒弟制度だけでなく学校で体系的に教育する。19世紀には、各地で薬学の教育機関が設けられた。",
  "pharmacy_law": "薬剤師・薬種商の登録や、毒物の販売などを法律で定める。薬の扱いが、法の枠組みの中に置かれていく。",
  "japan_pharm_admin": "明治の日本で、医療・薬事を国の行政として整える取り組みが進む。医制の公布や日本薬局方の制定など、近代的な制度づくりが続いた。",
  "exp_pharmacology": "動物実験などで、薬が体のどこにどう働くかを調べる学問。観察や経験だけでなく、実験によって薬の作用を確かめようとする方向が強まった。",
  "injection": "薬液を一定量はかって、皮下などに投与する方法。1850年代に皮下注射の器具と方法が発展し、単離された成分の使い方を広げた。",
  "epidemiology": "病気の起こり方を、地域や集団の記録から調べる方法。患者の分布や生活の条件を比べることで、病気の広がり方を考える。",
  "sanitation": "上下水道の整備や住環境の改善など、地域全体で病気を防ごうとする取り組み。19世紀のヨーロッパの都市で大きく進んだ。",
  "germ_theory": "微生物が発酵や腐敗、そして病気に関わるという考え方。19世紀後半に、多くの研究者の仕事を通じて段階的に形づくられていった。",
  "antisepsis": "石炭酸などの薬品を用いて、傷や器具などの汚染を抑え、感染を防ごうとする方法（防腐法）。微生物を持ち込まないようにする無菌法とは区別されるが、その発展にも影響した。",
  "bacteriology": "病気ごとに原因となる細菌を探し、培養して調べる学問。19世紀後半に、純粋培養や染色などの方法が整えられた。",
  "serum_therapy": "免疫を得た動物の血清に含まれる抗体（抗毒素）で、細菌の出す毒素を中和しようとする治療法。細菌学、毒素の研究、免疫の研究を背景に生まれた。",
  "chemotherapy": "病原体や病変組織などを選択的に標的として、化学物質によって病気を治療しようとする考え方。20世紀初めのエールリヒらの研究が、その代表的な例とされる。",
  "hormone": "体内で作用するホルモンを単離・精製し、その作用を明らかにして医薬品として利用する研究。アドレナリンやインスリンなどが治療に用いられるようになった。",
  "vitamin": "食物に含まれる微量な成分が足りないと病気が起こるという考え方と、その成分の研究。脚気や壊血病などの理解が進んだ。",
  "receptor": "薬物などが、細胞にある特定の受容体と相互作用することで作用を示す、という考え方。20世紀初めに原型が示され、のちの薬理学の基本的な考え方の一つとなった。",
  "sulfa": "細菌感染症に対する合成の化学療法薬。1930年代に登場し、抗生物質が広まる前の感染症治療を支えた。",
  "safety_law": "医薬品を販売する前に、安全性や有効性を科学的なデータによって評価する規制が整備されていく。1930年代の米国では、薬害事件をきっかけに安全性の審査が求められるようになった。",
  "antibiotics": "微生物などが産生する物質をはじめ、微生物の増殖や生存を抑える薬が発展する。1940年代のペニシリンの実用化が大きな転機となった。",
  "antibiotic_industry": "大型タンクでの発酵（深部培養）などによって、抗生物質を工業的に大量につくる。第二次世界大戦中に大きく進んだ。",
  "clinical_trial": "治療を無作為に割り付けて比較し、効果を評価する方法。1940年代の英国の結核の試験が、代表的な例として知られる。",
  "psychopharm": "精神疾患の症状を改善する薬が開発され、精神科の治療に薬物療法が広く取り入れられていく。",
  "structure_bio": "X線結晶解析などで、薬や生体分子の立体構造を調べる。構造がわかることで、分子の働きを考える手がかりが得られる。",
  "molecular_biology": "遺伝子、DNA、RNA、たんぱく質などの生命現象を、分子のレベルで研究する分野。20世紀半ば以降に大きく発展した。",
  "regulation": "医薬品の承認にあたり、品質・安全性・有効性を、臨床試験などのデータにもとづいて審査する制度が整備される。制度の形は国によって異なる。",
  "pharmacovigilance": "医薬品の使用後に生じた副作用などの情報を集めて評価し、安全対策につなげる仕組み。日本では、副作用の被害を救済する制度も別に設けられた。",
  "rational_design": "薬物の標的となる分子や作用の仕組みを考えて、目的に合った化合物を設計・選択する創薬の手法。",
  "bungyo_modern": "医師が出した処方箋をもとに、薬局で調剤する仕組みを日本で広げていく取り組み。",
  "recombinant": "DNAを組み換え、目的の遺伝子を別の生物の細胞の中で働かせる技術。1970年代に大きく発展した。",
  "biologics": "生物や細胞などを利用して製造される医薬品。遺伝子組換えでつくるたんぱく質や、抗体医薬などが含まれる。",
  "monoclonal": "特定の分子だけに結びつく抗体を、医薬品として用いる。がんや自己免疫の病気などの治療に使われている。",
  "microbial_screening": "微生物がつくる化合物を調べ、抗菌薬以外にも有用な薬理作用を持つ物質を探す。日本の研究者による成果も多い。",
  "ich": "日米欧などで、医薬品の承認に必要なデータの基準をそろえる取り組み。1990年に始まった。",
  "targeted_therapy": "病気に関わる特定の分子を狙って作用する薬。2000年代以降、がんなどの治療で大きく広がった。",
  "checkpoint": "免疫の働きにかかるブレーキ（免疫チェックポイント）を外し、がんに対する免疫の反応を高める抗体医薬。",
  "genome": "ゲノム情報を利用して、病気の原因や、薬の効き方・副作用の個人差を調べ、治療に役立てる研究。",
  "mrna_vaccine": "抗原の設計図となるmRNAを投与し、体内でそのたんぱく質をつくらせて免疫を得るワクチン。",
  "pharm_edu_6yr": "医療の中で働く薬剤師の教育を強化するため、日本の薬学教育が6年制になった。"
 },

  "brunfels": {
   "name": "オットー・ブルンフェルス",
   "life": "1488ごろ〜1534",
   "role": "植物学者・神学者",
   "text": "ドイツの神学者・植物学者。1530年から刊行された植物図譜では、実物を写生した木版の挿絵が用いられ、写実的な植物図の早い例として知られる。"
  },
  "fuchs_p": {
   "name": "レオンハルト・フックス",
   "life": "1501〜1566",
   "role": "医師・植物学者",
   "text": "ドイツの医師。1542年、実物観察を重視した挿絵入りの植物誌『De historia stirpium』を刊行した。植物の「フクシア」は彼にちなんで名づけられた。"
  },
  "cordus_p": {
   "name": "ヴァレリウス・コルドゥス",
   "life": "1515〜1544",
   "role": "薬剤師・植物学者",
   "text": "ドイツの薬剤師・植物学者。彼がまとめた調剤書は没後にニュルンベルクで刊行され、市の公的な基準として用いられた。29歳の若さで亡くなった。"
  },
  "de_la_cruz": {
   "name": "マルティン・デ・ラ・クルス",
   "life": "16世紀",
   "role": "先住民の医師",
   "text": "メキシコの先住民の医師。メキシコ先住民の薬用植物・医療の知識を記録した1552年の薬草書（バディアーノ写本）の内容を、編纂・記録した人物とされる。生涯について分かっていることは多くない。"
  },
  "badiano": {
   "name": "フアン・バディアーノ",
   "life": "16世紀",
   "role": "先住民の学者・翻訳者",
   "text": "メキシコの先住民の出身で、ラテン語を学んだ学者。デ・ラ・クルスがまとめた薬草書をラテン語に翻訳したとされ、写本は彼の名で呼ばれる。内容の編纂・記録はデ・ラ・クルス、ラテン語訳はバディアーノという分担だったと考えられている。"
  },
  "orta_p": {
   "name": "ガルシア・デ・オルタ",
   "life": "1501ごろ〜1568",
   "role": "医師",
   "text": "ポルトガル出身の医師。インドのゴアに移り住み、1563年に対話形式の『インド薬物誌』を刊行した。現地での観察にもとづき、インドの薬用植物を記録した。"
  },
  "monardes_p": {
   "name": "ニコラス・モナルデス",
   "life": "1493〜1588",
   "role": "医師",
   "text": "スペイン・セビリアの医師。自らは新大陸へ渡らなかったが、港に届く産物を調べ、新大陸由来の薬物を記録した書を著した。"
  },
  "clusius": {
   "name": "カロルス・クルシウス",
   "life": "1526〜1609",
   "role": "植物学者",
   "text": "フランドル出身の植物学者。オルタの『インド薬物誌』を要約し注釈を加えたラテン語版を出版して、ヨーロッパでの普及に関わった。晩年はライデン大学の植物園に関わり、チューリップの栽培でも知られる。"
  },
  "li_shizhen": {
   "name": "李時珍",
   "life": "1518〜1593",
   "role": "医師・本草学者",
   "text": "明の医師・本草学者。長年にわたって各地の薬物を調べ、『本草綱目』をまとめた。刊行は没後の1596年である。"
  },
  "hayashi_razan": {
   "name": "林羅山",
   "life": "1583〜1657",
   "role": "儒学者",
   "text": "江戸初期の儒学者で、徳川家康以後の将軍に仕えた。『本草綱目』の日本への伝来・普及に関わったとされ、1607年に長崎で入手して家康に献上したと伝えられる。"
  },
  "de_laune": {
   "name": "ギデオン・ド・ローン",
   "life": "1565ごろ〜1659",
   "role": "薬剤師",
   "text": "フランスから逃れたプロテスタント（ユグノー）の家に生まれ、ロンドンで活躍した薬剤師。ジェームズ1世の王妃アンの薬剤師を務め、食料品商組合からの分離を求める薬剤師たちを率いて、1617年のロンドン薬剤師協会の設立に関わった。"
  },
  "mayerne": {
   "name": "テオドール・ド・マイエルヌ",
   "life": "1573〜1655",
   "role": "医師",
   "text": "ジュネーヴ出身の医師で、イングランド王の侍医を務めた。化学的な薬剤の使用を支持し、1618年の『ロンドン薬局方』の編纂に関わって、巻末に化学的な薬剤の項を加えたとされる。"
  },
  "van_helmont": {
   "name": "ファン・ヘルモント",
   "life": "1580〜1644",
   "role": "医師・化学者",
   "text": "フランドルの医師・化学者。パラケルススの影響を受けた医化学者の一人で、「ガス」という言葉をつくったことでも知られる。"
  },
  "sydenham_p": {
   "name": "トーマス・シデナム",
   "life": "1624〜1689",
   "role": "医師",
   "text": "イングランドの医師。書物の理論よりも、病気の経過を注意深く観察して記録することを重んじた。のちに「イギリスのヒポクラテス」と呼ばれた。"
  },
  "boyle": {
   "name": "ロバート・ボイル",
   "life": "1627〜1691",
   "role": "自然哲学者・化学者",
   "text": "アイルランド出身の自然哲学者。1661年の『懐疑的化学者』で、実験にもとづいて物質を考える姿勢を示し、化学を実験的・定量的に扱う方向に影響を与えた。気体の圧力と体積の関係（ボイルの法則）でも知られる。"
  },
  "lemery": {
   "name": "ニコラ・レムリ",
   "life": "1645〜1715",
   "role": "薬剤師・化学者",
   "text": "フランスの薬剤師・化学者。1675年の『化学教程』は版を重ね、各国語に訳されて広く読まれた。"
  },
  "linnaeus": {
   "name": "カール・リンネ",
   "life": "1707〜1778",
   "role": "植物学者・医師",
   "text": "スウェーデンの植物学者・医師。1753年の『植物の種』で、属名と種小名の二語による植物の命名（二名法）を体系的に用いた。薬用植物を含む植物の名前を世界共通で呼べる、近代的な分類学の土台を整えた。"
  },
  "montagu": {
   "name": "メアリー・ウォートリー・モンタギュー",
   "life": "1689〜1762",
   "role": "著述家",
   "text": "イギリスの貴族の女性。大使の妻としてオスマン帝国に滞在した際、現地で以前から行われていた人痘接種を知った。帰国後、イギリスでの人痘接種の紹介と普及を促した。人痘接種は、のちのジェンナーの牛痘接種とは別の方法である。"
  },
  "lind_p": {
   "name": "ジェームズ・リンド",
   "life": "1716〜1794",
   "role": "海軍軍医",
   "text": "スコットランド出身の海軍軍医。1747年、壊血病の患者を複数の治療の組に分けて比べ、治療の効果を検討した。1753年に『壊血病論』を出版した。"
  },
  "withering_p": {
   "name": "ウィリアム・ウィザリング",
   "life": "1741〜1799",
   "role": "医師・植物学者",
   "text": "イングランドの医師・植物学者。1785年、ジギタリスを用いた治療の経験を整理し、適応・調製法・用量などを記録した報告を著した。ジギタリスの有効成分を取り出したわけではない。"
  },
  "kaibara": {
   "name": "貝原益軒",
   "life": "1630〜1714",
   "role": "儒学者・本草学者",
   "text": "江戸時代の儒学者・本草学者。1709年に『大和本草』を刊行し、薬用植物を含む多くの動植物や産物を、『本草綱目』の分類に独自の工夫を加えて記載した。健康の心得を説いた『養生訓』でも知られる。"
  },
  "yoshimune": {
   "name": "徳川吉宗",
   "life": "1684〜1751",
   "role": "江戸幕府8代将軍",
   "text": "享保の改革を進めた将軍。医療や本草学の振興を進め、1722年には小石川御薬園の中に養生所を設けた。薬用植物の栽培や調査も奨励した。"
  },
  "ogawa_shosen": {
   "name": "小川笙船",
   "life": "1672〜1760",
   "role": "町医者",
   "text": "江戸の町医者。貧しい病人のための施療所の設置を求めて、目安箱に意見を出したとされる。小石川養生所の設置につながった人物として知られる。"
  },
  "tamura_ransui": {
   "name": "田村藍水",
   "life": "1718〜1776",
   "role": "本草学者・医師",
   "text": "江戸の本草学者・医師。朝鮮人参の国産化をめざして栽培の研究を進めた。平賀源内の師で、1757年には源内の提唱により江戸・湯島で薬品会を開き、その後も会主として続けた。"
  },
  "gennai": {
   "name": "平賀源内",
   "life": "1728〜1780",
   "role": "本草学者・発明家",
   "text": "讃岐出身の本草学者で、田村藍水の門人。1757年、師の藍水に提唱して薬品会（物産会）を開かせ、1762年には自ら会主となって開いた。翌1763年、それまでの会の出品物から選んだものを『物類品隲』にまとめた。エレキテルの復元など、本草学以外でも幅広く活動した。"
  },
  "sugita": {
   "name": "杉田玄白",
   "life": "1733〜1817",
   "role": "蘭方医",
   "text": "江戸の蘭方医。前野良沢らとともにオランダ語の解剖書を訳し、1774年に『解体新書』として刊行した。観察にもとづく西洋医学が日本に広がるきっかけの一つとなった。"
  },
  "maeno": {
   "name": "前野良沢",
   "life": "1723〜1803",
   "role": "蘭方医",
   "text": "中津藩の医師。オランダ語の学習に打ち込み、杉田玄白らとの共同の翻訳作業で中心的な役割を担い、『解体新書』の刊行につながった。"
  },
  "jenner_p": {
   "name": "エドワード・ジェンナー",
   "life": "1749〜1823",
   "role": "医師",
   "text": "イングランドの医師。牛痘の材料を用いた接種を1796年に行い、1798年にその結果を報告した。この方法はのちに各地へ広がった。"
  },
  "hanaoka": {
   "name": "華岡青洲",
   "life": "1760〜1835",
   "role": "外科医",
   "text": "紀伊の外科医。曼陀羅華を主とする麻酔薬「通仙散」を工夫し、1804年に全身麻酔のもとで乳がんの手術を行ったとされる。多くの門人を育てた。"
  },
  "serturner_p": {
   "name": "フリードリヒ・ゼルチュルナー",
   "life": "1783〜1841",
   "role": "薬剤師",
   "text": "ドイツの薬剤師。アヘンから主成分を単離し、1817年の論文で「モルフィウム」として発表した。植物の有効成分の単離研究の重要な出発点の一つとされる。"
  },
  "pelletier": {
   "name": "ピエール＝ジョゼフ・ペルティエ",
   "life": "1788〜1842",
   "role": "薬剤師・化学者",
   "text": "フランスの薬剤師。カヴァントゥとともに、ストリキニーネやキニーネなど、植物のアルカロイドを単離した。"
  },
  "caventou": {
   "name": "ジョゼフ・ビヤンネメ・カヴァントゥ",
   "life": "1795〜1877",
   "role": "薬剤師・化学者",
   "text": "フランスの薬剤師。ペルティエとの共同研究で、キニーネなどのアルカロイドの単離を報告した。"
  },
  "magendie_p": {
   "name": "フランソワ・マジャンディ",
   "life": "1783〜1855",
   "role": "生理学者",
   "text": "フランスの生理学者。動物実験によって生体の働きや薬物の作用を調べ、実験生理学・実験薬理学の発展に重要な役割を果たした。"
  },
  "bernard": {
   "name": "クロード・ベルナール",
   "life": "1813〜1878",
   "role": "生理学者",
   "text": "マジャンディの弟子のフランスの生理学者。矢毒クラーレが、神経を刺激しても筋肉が収縮しなくなる作用を実験的に研究するなど、薬物を用いた生理学の研究で知られる。"
  },
  "wohler_p": {
   "name": "フリードリヒ・ヴェーラー",
   "life": "1800〜1882",
   "role": "化学者",
   "text": "ドイツの化学者。1828年に無機の塩から尿素を合成した。リービッヒとの共同研究や、アルミニウムの研究でも知られる。"
  },
  "liebig": {
   "name": "ユストゥス・フォン・リービッヒ",
   "life": "1803〜1873",
   "role": "化学者",
   "text": "ドイツの化学者。ギーセン大学の研究室で、学生に実験を通して化学を教え、多くの化学者を育てた。有機化合物の分析法の改良や、1832年のクロラールの合成でも知られる。"
  },
  "siebold_p": {
   "name": "フィリップ・フランツ・フォン・シーボルト",
   "life": "1796〜1866",
   "role": "医師・博物学者",
   "text": "ドイツ出身の医師。オランダ商館の医師として1823年に来日し、長崎の鳴滝塾で西洋医学を教えた。日本の植物や産物の研究も行った。"
  },
  "ogata": {
   "name": "緒方洪庵",
   "life": "1810〜1863",
   "role": "蘭方医",
   "text": "大坂の蘭方医。適塾を開いて多くの門人を育て、1849年に大坂除痘館を開いて牛痘種痘の普及に取り組んだ。"
  },
  "long": {
   "name": "クロフォード・ロング",
   "life": "1815〜1878",
   "role": "医師",
   "text": "アメリカ・ジョージア州の医師。1842年にエーテルを用いて手術を行ったが、報告したのは数年後だった。"
  },
  "wells": {
   "name": "ホレス・ウェルズ",
   "life": "1815〜1848",
   "role": "歯科医",
   "text": "アメリカの歯科医。笑気（亜酸化窒素）を用いた歯科での麻酔を試みた。"
  },
  "morton": {
   "name": "ウィリアム・モートン",
   "life": "1819〜1868",
   "role": "歯科医",
   "text": "アメリカの歯科医。1846年10月16日、ボストンでエーテル麻酔の公開実演を行い、麻酔が広く知られるきっかけとなった。"
  },
  "simpson": {
   "name": "ジェームズ・ヤング・シンプソン",
   "life": "1811〜1870",
   "role": "産科医",
   "text": "エディンバラの産科医。1847年にクロロホルムを麻酔に用い、その臨床での使用を広めた。"
  },
  "semmelweis_p": {
   "name": "ゼンメルワイス・イグナーツ",
   "life": "1818〜1865",
   "role": "産科医",
   "text": "ハンガリー出身の医師。ウィーンの産科で、さらし粉から作った塩素系の消毒液による手洗いによって、産褥熱の死亡率が低下することを示した。"
  },
  "buchheim_p": {
   "name": "ルドルフ・ブッフハイム",
   "life": "1820〜1879",
   "role": "薬理学者",
   "text": "ドイツ出身の薬理学者。ドルパト大学で、自宅の地下に設けた研究室で実験薬理学の研究と教育を始め、それはのちに大学の研究施設として整備された。"
  },
  "snow_p": {
   "name": "ジョン・スノウ",
   "life": "1813〜1858",
   "role": "医師",
   "text": "ロンドンの医師。1854年のコレラ流行で患者の分布と水源の関係を調べた。エーテルやクロロホルムによる麻酔の研究でも知られる。"
  },
  "perkin_p": {
   "name": "ウィリアム・ヘンリー・パーキン",
   "life": "1838〜1907",
   "role": "化学者",
   "text": "イギリスの化学者。1856年に紫色の合成染料モーブを得て、工業化した。"
  },
  "pasteur_p": {
   "name": "ルイ・パスツール",
   "life": "1822〜1895",
   "role": "化学者・微生物学者",
   "text": "フランスの化学者。発酵や腐敗に微生物が関わることを示し、のちに狂犬病などのワクチンの研究も行った。"
  },
  "niemann_p": {
   "name": "アルベルト・ニーマン",
   "life": "1834〜1861",
   "role": "化学者",
   "text": "ドイツの薬剤師・化学者。ゲッティンゲン大学でヴェーラーの講義を受け、のちにその助手となった。ヴェーラーの指導・助言のもとでコカの葉の研究を行い、1860年に純粋なコカインを単離して「コカイン」と名づけた。"
  },
  "lister_p": {
   "name": "ジョゼフ・リスター",
   "life": "1827〜1912",
   "role": "外科医",
   "text": "イギリスの外科医。石炭酸などを用いて手術後の感染を防ごうとする防腐法を報告し、外科に広めた。"
  },
  "schmiedeberg": {
   "name": "オスヴァルト・シュミーデベルク",
   "life": "1838〜1921",
   "role": "薬理学者",
   "text": "ブッフハイムのもとで学んだ薬理学者。シュトラスブルク大学で長く薬理学を教え、各国から集まった研究者に指導を行った。"
  },
  "kolbe": {
   "name": "ヘルマン・コルベ",
   "life": "1818〜1884",
   "role": "化学者",
   "text": "ドイツの化学者。1860年ごろサリチル酸の合成法を示し、のちに改良した。工業的な製造は、その方法をもとに弟子のフォン・ハイデンが1874年に始めた。"
  },
  "koch_p": {
   "name": "ロベルト・コッホ",
   "life": "1843〜1910",
   "role": "医師・細菌学者",
   "text": "ドイツの医師。炭疽菌の研究、1882年の結核菌の報告、1883〜1884年のエジプトとインドでのコレラの調査とコレラ菌の同定などで知られ、細菌を純粋に培養して調べる方法の整備に大きく寄与した。"
  },
  "knorr": {
   "name": "ルートヴィヒ・クノール",
   "life": "1859〜1921",
   "role": "化学者",
   "text": "ドイツの化学者。1883年にアンチピリンを合成した。"
  },
  "koller_p": {
   "name": "カール・コラー",
   "life": "1857〜1944",
   "role": "眼科医",
   "text": "ウィーンの眼科医。1884年にコカインを目の手術の局所麻酔に用いることを報告した。のちにアメリカで活動した。"
  },

/* ---------- 計算 ---------- */
const own=id=>S.own[id]||0;
let PROD=0, MULT={};
function recalc(){
  MULT={};
  FACS.forEach(f=>{let m=1; EVENTS.forEach(e=>{ if(S.ev[e.id]&&(e.fx.fac==='all'||e.fx.fac.includes(f.id))) m+=e.fx.pct/100; }); if(S.up[f.id]) m*=UP_MULT; MULT[f.id]=m*sfTrust();});
  PROD=FACS.reduce((a,f)=>a+own(f.id)*f.prod*MULT[f.id],0);
}
const costOf=(f,n)=>f.cost*Math.pow(RATE,own(f.id)+n);
function bulk(f,q){ let s=0,n=0; if(q==='max'){ let kp=S.kp; while(n<500){const c=costOf(f,n); if(kp<c) break; kp-=c; s+=c; n++;} if(n===0) return {n:1,c:costOf(f,0)}; return {n,c:s}; }
  for(let i=0;i<q;i++) s+=costOf(f,i); return {n:q,c:s}; }
const upCost=f=>f.cost*UP_COSTX;
const cutOf=r=>{let c=0; EVENTS.forEach(e=>{ if(S.ev[e.id]&&e.fx.cut&&e.fx.cut.route===r) c+=e.fx.cut.pct; }); return Math.min(c,50);};
const BONUS_CUT=30; // 合流ボーナス：必須ではない関連研究が済んでいればコスト −30%
const bonusOn=t=>!!(t.bonus&&t.bonus.every(x=>S.tech[x]));
const techCost=t=>Math.max(1,Math.round(t.cost*(1-cutOf(t.route)/100)*(bonusOn(t)?1-BONUS_CUT/100:1)));
const tapGain=()=>Math.max(1,PROD*0.01);
const OFF_EFF=0.2, OFF_MAX=3600, OFF_MIN=60; // 留守中の収入：生産量の20%、最大1時間、1分未満は数えない
function fmt(n){ if(!isFinite(n)) return '∞'; if(n<1000) return n<10?n.toFixed(n<1?2:1).replace(/\.0+$/,''):Math.floor(n).toString();
  const u=['K','M','B','T','Qa','Qi','Sx','Sp','Oc','No','Dc']; let i=-1; while(n>=1000&&i<u.length-1){n/=1000;i++;} return (n<10?n.toFixed(2):n<100?n.toFixed(1):Math.floor(n))+u[i]; }
const fmtYear=y=>y<0?'前'+(-y):y+'年';
const yearLabel=e=>e.yl||fmtYear(e.year);

const met1=r=>r.indexOf('ev:')===0?!!S.ev[r.slice(3)]:!!S.tech[r];
const metP=r=>r.split('|').some(met1); // 'a|b' はどちらか一方でよい

/* ---------- 情報開示（v21）----------

 LEVEL1 ？？？：研究の直後1段階／図鑑の未発見枠（到達済みの時代のみ）
 LEVEL2 解禁：研究可能な研究／解禁済みの施設

function techVis(t){ const st=techState(t); if(st==='done'||st==='avail') return st; if(st==='eralock') return 'hidden';
  // 直後1段階：前提に含まれる研究のうち、研究済みか研究可能なものが1つでもあれば「？？？」として見せる（前提が複数でも、1つでも手前に届いていれば）
  return refs(t).some(r=>r.indexOf('ev:')!==0&&TECH[r]&&['done','avail'].includes(techState(TECH[r])))?'next':'hidden'; }
const techKnown=t=>['done','avail'].includes(techVis(t));

const chapterOf=id=>(PEOPLE_NET[id]&&CHAP[PEOPLE_NET[id].chapter]?PEOPLE_NET[id].chapter:CHAP_LISTED[id]||CHAPTER_OF_ERA[PER[id].era]);

  return listed.concat(PEOPLE.map(x=>x.id).filter(id=>chapterOf(id)===cid&&!listed.includes(id))).map(id=>PER[id]); }
const drugName=id=>CONTENT.drugs[id].name;
function resolveDrug(r){ const k=typeof r==='object'&&r?r.id||r.name:r; if(DRG[k]) return k; const d=DRUGS.find(x=>drugName(x.id)===k); return d?d.id:null; }
function resolveEvents(r){ const k=typeof r==='object'&&r?r.id||r.title:r; if(EV[k]) return [k]; if(PEOPLE_EVENT_ALIAS[k]) return PEOPLE_EVENT_ALIAS[k].filter(x=>EV[x]);
  const e=EVENTS.find(x=>CONTENT.events[x.id].title===k); return e?[e.id]:[]; }

const personEventIds=id=>{ const d=P(id); return d.relatedEvents&&d.relatedEvents.length?[].concat(...d.relatedEvents.map(resolveEvents)):PER[id].cond.filter(r=>r.indexOf('ev:')===0).map(r=>r.slice(3)); };
const labelOf=r=>typeof r==='object'&&r?(r.label||r.name||r.title||r.id):r;

function checkPeopleNet(){ const w=[], known=id=>!!PER[id];
  Object.entries(PEOPLE_NET).forEach(([id,d])=>{
    if(!known(id)) w.push(id+'：新規人物には unlock {era:1〜'+ERAS.length+', cond:[…]}（または PEOPLE_NET_UNLOCK）が必要（図鑑に載りません）');
    else if(!CONTENT.people[id]||(!d.name&&!CONTENT.people[id].name)) w.push(id+'：name がありません');
    const u=d.unlock||PEOPLE_NET_UNLOCK[id]; if(u) (u.cond||[]).forEach(r=>{ const ok=r.indexOf('ev:')===0?!!EV[r.slice(3)]:r.indexOf('fac:')===0?!!FAC[r.split(':')[1]]:!!TECH[r]; if(!ok) w.push(id+'：unlock.cond の「'+r+'」が見つかりません'); });
    (d.relatedPeople||[]).forEach(r=>{ if(!r||!known(r.id)) w.push(id+'：関連人物「'+(r&&r.id)+'」が見つかりません（表示しません）'); else if(!r.relation) w.push(id+'：関連人物「'+r.id+'」に relation がありません'); });
    (d.relatedDrugs||[]).forEach(r=>{ if(!resolveDrug(r)) w.push(id+'：関連薬物「'+labelOf(r)+'」は薬物図鑑にないため文字だけ表示'); });
    (d.relatedEvents||[]).forEach(r=>{ if(!resolveEvent(r)) w.push(id+'：関連する出来事「'+labelOf(r)+'」は歴史にないため文字だけ表示'); });
    if(d.chapter&&!CHAP[d.chapter]) w.push(id+'：chapter「'+d.chapter+'」がありません');
    // era が絞り込みの区分（PERSON_PERIODS）以外の値のときは、時代の絞り込みにゲーム内の時代を使う（データの誤りではないので警告しない）
  });
  return w; }
function techState(t){ if(S.tech[t.id]) return 'done'; if(t.era>S.era) return 'eralock'; return t.prereq.every(metP)?'avail':'locked'; }

/* ---------- 進行判定（イベント・時代・クリア） ---------- */
const queue=[]; // 表示待ちの演出
function progress(silent){
  let ch=true, newEv=[], eraUp=[];
  while(ch){ ch=false;
    EVENTS.forEach(e=>{ if(S.ev[e.id]||e.era>S.era) return; const t=e.trig; // 出来事は自分の時代に入ってから起こる
      if((t.tech||[]).every(x=>S.tech[x]) && Object.entries(t.fac||{}).every(([k,n])=>own(k)>=n)){ S.ev[e.id]=++S.order; newEv.push(e.id); ch=true; } });
    const rq=ERA_REQ[S.era+1]; if(rq&&rq.tech.every(x=>S.tech[x])&&rq.ev.every(x=>S.ev[x])){ S.era++; eraUp.push(S.era); ch=true; }
  }
  const condOk=c=>c.every(r=>r.indexOf('fac:')===0?own(r.split(':')[1])>=+r.split(':')[2]:met1(r));
  const newP=[]; PEOPLE.forEach(x=>{ if(!S.met[x.id]&&x.era<=S.era&&condOk(x.cond)){ S.met[x.id]=++S.order; newP.push(x.id); } });
  if(newP.length&&!silent) notify({k:'per',t:newP.map(id=>P(id).name)});
  if(newP.length&&!newEv.length) renderNav();
  if(newEv.length){ recalc(); if(!silent) notify({k:'ev',t:newEv.map(id=>CONTENT.events[id].title)}); }
  if(eraUp.length&&!silent) eraUp.forEach(e=>{ if(e===6&&!S.medShown) queue.push({k:'med'}); if(e===8&&!S.kinShown) queue.push({k:'kin'}); if(e===10&&!S.kdShown) queue.push({k:'kd'}); queue.push({k:'era',era:e}); });
  checkFlow(silent);
  if(!S.cleared&&CLEAR.tech.every(x=>S.tech[x])&&CLEAR.ev.every(x=>S.ev[x])){ S.cleared=true; if(!silent) queue.push({k:'clear'}); }
  if(newEv.length||eraUp.length) renderAll();
  runQueue();
}
function runQueue(){ if($('ovm').classList.contains('show')||!$('ending').hidden||sfOpen()||!queue.length) return; const q=queue.shift(); if(q.k==='era') showEra(q.era); else if(q.k==='med') showMed(); else if(q.k==='kin') showKinsei(); else if(q.k==='kd') showKindai(); else if(q.k==='clear') showClear(); }

function research(id){ const t=TECH[id]; if(!t||techState(t)!=='avail'||S.kp<techCost(t)) return false;

function buyUp(id){ const f=FAC[id]; if(S.up[id]||own(id)<UP_OWN||S.kp<upCost(f)) return false; S.kp-=upCost(f); S.up[id]=1; recalc(); renderAll(); return true; }

/* ---------- 段階チュートリアル：初めてその仕組みに触れた瞬間だけ、短く案内する ---------- */
function coachUpdate(){
  document.querySelectorAll('.tut-hi').forEach(el=>el.classList.remove('tut-hi'));
  const box=$('coach'); if(!S.prologueDone||!$('pro').hidden||!$('ending').hidden||sfOpen()||$('ovm').classList.contains('show')){ box.hidden=true; return; }
  let cur=null;
  for(let i=0;i<TUT.length;i++){ const t=TUT[i]; if(S.tut[t.id]) continue;
    if(t.done&&t.done()){ S.tut[t.id]=1; continue; }
    if(t.when&&!t.when()) break;
    const nx=TUT[i+1]; if(t.skippable&&nx&&!S.tut[nx.id]&&nx.when()){ S.tut[t.id]=1; continue; } // 次の段階が来たら、読み流せる案内は自動で閉じる
    cur=t; break; }
  if(!cur){ box.hidden=true; return; }
  $('coachT').innerHTML=cur.text(); box.dataset.id=cur.id; box.hidden=false;
  const sel=cur.target&&cur.target(); if(sel){ const el=document.querySelector(sel); if(el) el.classList.add('tut-hi'); }
  if(cur.auto&&!cur._t){ cur._t=setTimeout(()=>{ S.tut[cur.id]=1; coachUpdate(); },cur.auto); } }

let toastT=0, toastCb=null;
let toastCur=null; // 表示中のキュー由来の通知（モーダルが開いたら、閉じたあとに出し直す）
function toastRaw(html,cb,dur,item){ const t=$('toast'); t.innerHTML=html; toastCb=cb||null; toastCur=item||null; t.classList.add('show'); clearTimeout(toastT);
  toastT=setTimeout(()=>{ t.classList.remove('show'); setTimeout(pumpN,NQ_GAP); },dur||3500); }
// 操作の反応（知識Pが足りません 等）：キューに入れず即時に表示する
function toast(msg,cb){ toastRaw(String(msg).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])),cb); }
/* 通知キュー：歴史・人物・理解段階・おかえりなさい。モーダル（時代開始・クリア等）やプロローグの表示中は保留し、
   閉じてから「理解段階（1件ずつ）→ 歴史（集約）→ 人物（集約）→ おかえりなさい」の順に出す */
const NQ_GAP=600; let nq=[];
const nHeld=()=>$('ovm').classList.contains('show')||!$('pro').hidden||!$('ending').hidden||sfOpen();
function notify(item){ nq.push(item); setTimeout(pumpN,0); } // 同じ処理の中で開くモーダルを待ってから判定する
function pumpN(){ if(!nq.length||nHeld()||$('toast').classList.contains('show')) return;
  // 後ろに通知が控えているときは表示を少し短くして、待ち時間を減らす
  const show=(html,cb,dur)=>toastRaw(html,cb,dur||(nq.length?2600:3500),{k:'again',html,cb,dur});
  const ai=nq.findIndex(x=>x.k==='again'); if(ai>=0){ const x=nq.splice(ai,1)[0]; show(x.html,x.cb,x.dur); return; }
  const take=k=>{ const xs=nq.filter(x=>x.k===k); nq=nq.filter(x=>x.k!==k); return xs; };
  const fi=nq.findIndex(x=>x.k==='flow');
  if(fi>=0){ const f=FLOW_BY[nq.splice(fi,1)[0].id]; show('🧭 薬の理解が〈'+f.name+'〉の段階へ<small>'+f.text+'</small>',()=>setTab('record')); return; }
  if(nq.some(x=>x.k==='ev')){ const t=[].concat(...take('ev').map(x=>x.t)); show(t.length===1?'📜 歴史が動いた：'+t[0]:'📜 歴史が'+t.length+'件動きました',()=>setTab('history')); return; }
  if(nq.some(x=>x.k==='per')){ const t=[].concat(...take('per').map(x=>x.t)); show(t.length===1?'👤 人物図鑑に登場：'+t[0]:'👤 人物図鑑に'+t.length+'人登場しました',()=>{codexSub='person';setTab('codex');}); return; }
  const w=take('w'); if(w.length) show(w[w.length-1].msg,null,4500); }

function grantOffline(sec){ if(!(sec>=OFF_MIN)||PROD<=0) return; const t=Math.min(sec,OFF_MAX), g=PROD*t*OFF_EFF; S.kp+=g; S.kpTotal+=g;
  const h=Math.floor(sec/3600), mi=Math.floor(sec%3600/60);
  notify({k:'w',msg:'おかえりなさい。留守の'+(h?h+'時間':'')+mi+'分で '+fmt(g)+' の知識Pを得ました（生産量の'+Math.round(OFF_EFF*100)+'%'+(sec>OFF_MAX?'・最大'+(OFF_MAX/3600)+'時間分':'')+'）'}); }
// 留守の時間は「最後に画面を見ていた時刻」から一度だけ数える（復帰の経路が重なっても二重に加算しない）
let activeAt=Date.now();
function claimAway(){ const now=Date.now(), sec=(now-activeAt)/1000; activeAt=now; grantOffline(sec); }
function tick(){ const now=performance.now(); let dt=(now-last)/1000; last=now; if(dt<0) dt=0;
  if(document.hidden) return; // 画面を離れている間は数えず、戻ったときにまとめて計算する
  if(Date.now()-activeAt>5000){ claimAway(); dt=0; } // スリープ等で止まっていた場合
  activeAt=Date.now();
  S.kp+=PROD*dt; S.kpTotal+=PROD*dt; S.playSec+=dt; acc+=dt;
  updateNums(); if(acc>=1){ acc=0; renderNav(); } }

  timeline:[['1960年代','各地で多発'],['1964年ごろ','SMONの病名が使われ始める'],['1970年8月','キノホルム原因説'],['1970年9月','販売・使用の停止'],['1972年','研究班の総括']],
  meaning:'国内で多くの患者を出した薬害。原因究明、訴訟、そして被害を救済する制度の議論へとつながった。',
  examPoints:['キノホルム → スモン（亜急性脊髄視神経症）','医薬品副作用被害救済制度の背景'],prerequisite:'N07',technologyUnlock:[],
  relief:'スモンの被害は、サリドマイドなどとともに、医薬品副作用被害救済制度の成立へとつながる背景になった。'},
 {id:'N09',year:1967,yl:'1967–1972',chapter:2,type:'system',titleJa:'副作用情報を集める',head:'報告が集まる場所',titleEn:'ADVERSE REACTION MONITORING',
  body:['1967年、日本で副作用モニター制度が始まった。指定された病院から、医薬品の副作用の情報を国が集める仕組みである。','1968年、WHOは国際医薬品モニタリング制度を始め、各国の副作用情報を国境を越えて共有するようになった。日本は1972年にこれに参加した。','一つの病院では見えない、まれな副作用も、集めれば見えてくる。'],
  meaning:'医療現場の情報が、安全対策の「入口」として制度になった。',
  examPoints:['副作用報告制度の起源','自発報告','医薬品・医療機器等安全性情報報告制度の前身'],prerequisite:'N08',technologyUnlock:['T3']},
 {id:'N10',year:1979,yl:'1979–1980',chapter:2,type:'system',titleJa:'薬事法改正と医薬品副作用被害救済制度',head:'安全網を張る',titleEn:'THE SAFETY NET',
  body:['サリドマイドやスモンなどの経験を背景に、1979年、薬事法が大きく改正された。承認後に改めて有効性と安全性を確かめる再審査と再評価が、法律に定められた。','同じ年、医薬品副作用被害救済基金法が成立し、1980年に救済業務が始まった。','医薬品を適正に使っても、副作用による健康被害は起こりうる。その被害を、裁判によらずに救済するための仕組みである。','ただし、厚生労働大臣が指定する抗悪性腫瘍剤など、一部の医薬品は救済制度の対象から除外されている。'],
  meaning:'「承認後も見直す」「起きた被害を救済する」という、二つの安全網ができた。',
  examPoints:['再審査制度','再評価制度','医薬品副作用被害救済制度（適正使用が前提・対象除外医薬品あり・現在の窓口はPMDA）'],prerequisite:'N09',technologyUnlock:['T4']},

 {id:'N11',year:1993,yl:'1993',chapter:3,type:'signal',titleJa:'ソリブジン事件',head:'二つの薬が出会うとき',titleEn:'SORIVUDINE 1993',
  body:['1993年、帯状疱疹の治療薬ソリブジンが発売された。','発売から間もなく、フルオロウラシル（5-FU）系の抗がん薬を服用していた患者に、重い骨髄抑制などが起こり、死亡例が相次いだ。','ソリブジンは、腸内細菌によって代謝物BVU（ブロモビニルウラシル）に変わる。BVUは、5-FUを分解する酵素DPDを阻害する。分解されなくなった5-FUが体内にたまり、強い毒性が現れた。','どちらの薬も、単独では想定どおりに使われていた。'],
  chain:['ソリブジン','腸内細菌','BVU','DPD阻害','5-FUの分解低下','5-FU曝露の増大','重篤な毒性'],
  meaning:'代謝酵素を介した相互作用が、致死的な害になりうることを示した。治験段階の情報の扱いも問題になった。',
  examPoints:['ソリブジン → BVU → DPD阻害 → 5-FU蓄積','テガフールなどのフッ化ピリミジン系','併用禁忌','DPDとギメラシル'],prerequisite:'case:c3',technologyUnlock:['T5']},
 {id:'N12',year:1997,yl:'1996–2001',chapter:3,type:'system',titleJa:'市販後を見張る（GCP・GPMSP・市販直後調査）',head:'発売は終わりではない',titleEn:'POST-MARKETING SURVEILLANCE',
  body:['1990年代、ソリブジン事件や薬害エイズ事件などを経て、医薬品の安全対策が見直された。','1996年の薬事法改正を受け、1997年には治験の基準（GCP）と市販後調査の基準（GPMSP）が省令として整えられた。','2001年10月には市販直後調査が始まった。新薬の販売開始から6か月間、医療機関に適正使用を繰り返し呼びかけ、重い副作用の情報をいち早く集める。','治験に参加できる患者の数には限りがある。発売直後こそ、まだ知られていないリスクが現れやすい。'],
  meaning:'「発売後の早い時期を重点的に監視する」という考え方が、制度になった。',
  examPoints:['GCP','市販直後調査（販売開始後6か月）','治験の限界（症例数・対象患者の制限）'],prerequisite:'N11',technologyUnlock:['T6']},

 {id:'N13',year:1983,yl:'1980年代–1996',chapter:4,type:'disaster',titleJa:'薬害エイズ',head:'血液から来たもの',titleEn:'HIV AND BLOOD PRODUCTS',
  body:['1980年代、血友病の治療に使われた非加熱の血液凝固因子製剤に、HIVが混入していた。','多くの供血者の血漿を集めて作る製剤は、一人の感染が多くの患者に広がりうる。','ウイルスを不活化した加熱製剤が登場した後も、非加熱製剤の使用は続いた。その結果、多くの患者がHIVに感染した。','訴訟は1996年に和解に至った。'],
  meaning:'生物由来の原料そのものが、感染症のリスクになりうることを示した。行政と企業の対応の遅れが問われた。',
  examPoints:['非加熱血液凝固因子製剤','血液製剤のウイルス不活化','生物由来製品'],prerequisite:'case:c4',technologyUnlock:[],
  codexNote:'薬害ヤコブ病：ヒト乾燥硬膜の移植によって、クロイツフェルト・ヤコブ病に感染した被害。訴訟は2002年に和解した。生物由来の材料が感染を運んだ例として、薬害エイズと並べて語られる。',
  relief:'和解ののち、1999年に「誓いの碑」が建てられた。'},
 {id:'N14',year:1988,yl:'1980年代–2010',chapter:4,type:'disaster',titleJa:'薬害肝炎',head:'何年も後に知る',titleEn:'HEPATITIS C AND BLOOD PRODUCTS',
  body:['出産時の出血などに使われたフィブリノゲン製剤などの血液製剤によって、C型肝炎ウイルスに感染した人々がいた。','感染は自覚症状のないまま進み、何年も経ってから知ることも多かった。','2008年1月、被害者を救済する特別措置法が成立した。2010年4月には、事件の検証と再発防止を検討した委員会が、最終提言をまとめた。'],
  meaning:'長い潜伏を経て明らかになる被害がある。被害の「検証」そのものが、再発防止の仕組みに組み込まれた。',
  examPoints:['フィブリノゲン製剤','HCV','薬害再発防止の最終提言'],prerequisite:'N13',technologyUnlock:[],
  relief:'2008年の特別措置法により、給付金の支給による救済が行われるようになった。'},
 {id:'N15',year:2004,yl:'2002–2004',chapter:4,type:'system',titleJa:'生物由来製品とPMDA',head:'審査・安全対策・救済',titleEn:'SAFETY TRIANGLE',
  body:['2002年の薬事法改正で、生物由来製品という区分が設けられた。原料の採取から使用後の記録まで、特別な管理が求められるようになった。','2004年、医薬品医療機器総合機構（PMDA）が設立された。同じ年、生物由来製品を介した感染等による健康被害を救済する制度も始まった。','PMDAは、承認の審査、市販後の安全対策、健康被害の救済を、一つの機関で担う。この三つの連携は、セイフティ・トライアングルと呼ばれる。'],
  meaning:'「入口（審査）」「監視（安全対策）」「出口（救済）」が、一つの組織でつながった。',
  examPoints:['PMDAの3業務','生物由来製品・特定生物由来製品','生物由来製品感染等被害救済制度'],prerequisite:'N14',technologyUnlock:['T7','T8']},

 {id:'N16',year:2002,yl:'2002–2004',chapter:5,type:'signal',titleJa:'ゲフィチニブ',head:'発売直後のシグナル',titleEn:'GEFITINIB 2002',
  body:['2002年7月、肺がんの分子標的薬ゲフィチニブが、世界に先駆けて日本で承認され、発売された。','発売後、市販直後調査の期間中に、急性肺障害・間質性肺炎の報告が相次いだ。死亡例も含まれていた。','同年10月、緊急安全性情報が出され、警告や使用上の注意が強化された。','2004年、がん細胞のEGFR遺伝子の活性化変異が、この薬がよく効くことと関係していると報告された。安全性の問いは、「誰に使えば利益が大きいのか」という問いにつながっていった。'],
  timeline:[['2002年7月','日本で承認・発売'],['発売後','急性肺障害・間質性肺炎の報告'],['2002年10月','緊急安全性情報'],['その後','使用上の注意の強化'],['2004年','EGFR活性化変異と感受性の関係']],
  meaning:'市販後の安全性シグナルの検出と、医療現場へのリスクコミュニケーションの代表例。分子標的薬における患者選択（個別化医療）の転換点でもある。',
  examPoints:['EGFRチロシンキナーゼ阻害薬','間質性肺炎','緊急安全性情報','EGFR遺伝子変異検査'],prerequisite:'case:c5',technologyUnlock:['T9'],
  note:'この出来事をめぐる訴訟では、最終的に製薬企業と国の賠償責任は認められなかった（2013年、最高裁）。このゲームでは「薬害」とは表記せず、市販後の安全性シグナルとリスクコミュニケーションの事例として扱っている。'},
 {id:'N17',year:2005,yl:'2005',chapter:5,type:'system',titleJa:'GVP・GPSP',head:'監視を仕事にする',titleEn:'GVP / GPSP',
  body:['2005年、製造販売業者の市販後の責任を定める二つの基準が施行された。','GVPは、安全性に関する情報を集め、検討し、必要な安全確保措置をとるための体制と手順を定める。','GPSPは、製造販売後の調査と試験を、信頼できる方法で行うための基準である。市販直後調査も、GVPのもとで行われる。','副作用を「見つけたら対応する」から、「見つけるための体制を常に持つ」へ。'],
  meaning:'市販後の安全管理が、企業の日常業務として基準になった。',
  examPoints:['GVP（製造販売後安全管理の基準）','GPSP（製造販売後の調査及び試験の実施の基準）','GQP・GMP・GCP・GLPとの区別'],prerequisite:'N16',technologyUnlock:['T10','T11']},
 {id:'N18',year:2011,yl:'2011',chapter:5,type:'system',titleJa:'安全性情報の段階化',head:'黄色と青',titleEn:'YELLOW LETTER / BLUE LETTER',
  body:['見つけたリスクは、医療現場に届かなければ患者を守れない。','2011年、安全性情報の伝達方法が整理され、安全性速報（ブルーレター）の枠組みが設けられた。','リスクの緊急度に応じて、伝え方の強さを変える。'],
  compare:[['緊急安全性情報','YELLOW LETTER','緊急かつ重大な注意喚起や、使用制限に関わる対策が必要なとき'],['安全性速報','BLUE LETTER','一般的な使用上の注意の改訂よりも、迅速な注意喚起や適正使用のための対応が必要なとき'],['使用上の注意の改訂','REVISION','添付文書の改訂として伝える。改訂の情報はDSUなどでまとめて周知される']],
  meaning:'情報伝達の「強さ」を段階に分けた。ブルーレターの枠組みは、ここで設けられた。',
  examPoints:['緊急安全性情報（黄）','安全性速報（青）','使用上の注意の改訂','DSU（医薬品安全対策情報）'],prerequisite:'N17',technologyUnlock:['T12']},
 {id:'N19',year:2013,yl:'2012–2013',chapter:5,type:'system',titleJa:'医薬品リスク管理計画（RMP）',head:'分かっていることと、分かっていないこと',titleEn:'RISK MANAGEMENT PLAN',
  body:['2012年に指針が示され、2013年4月以降に承認申請される新薬から、医薬品リスク管理計画（RMP）が作られるようになった。','RMPでは、まず安全性検討事項として、重要な特定されたリスク、重要な潜在的リスク、重要な不足情報を整理する。','そのうえで、それぞれをどう監視するか（医薬品安全性監視活動）と、どう減らすか（リスク最小化活動）を計画する。','かつて薬害を起こしたサリドマイドも、2008年に多発性骨髄腫の治療薬として再び承認された。いまは厳格な管理手順のもとで使われている。'],
  meaning:'リスク管理が、発売後の個別の対応から、「発売の時点からの計画」になった。',
  examPoints:['RMPの構成（安全性検討事項・医薬品安全性監視計画・リスク最小化計画）','追加のリスク最小化活動','サリドマイド製剤の安全管理手順'],prerequisite:'N18',technologyUnlock:['T13']},
 {id:'N20',year:2019,yl:'2019–2023',chapter:5,type:'system',titleJa:'情報を届ける時代',head:'患者と現場へ',titleEn:'SAFETY INFORMATION FOR ALL',
  body:['2019年3月、患者や家族からの副作用報告の正式な受付が始まった（2012年からの試行を経て）。','2021年8月、医療用医薬品などの添付文書を電子的に提供する制度が施行された。紙の添付文書を製品に同梱できる経過措置は、2023年7月末まで続いた。','箱のバーコードを読み取れば、最新の情報にたどり着ける。','安全性情報は、作る側から使う側へ、より速く、より直接に届くようになった。'],

/* 専門史の登録（将来の専門史も、ここに同じ形で足す） */
const SPECIAL_HISTORIES={safety:{title:'薬害から医薬品安全へ',en:'FROM DRUG DISASTERS TO DRUG SAFETY',saveKey:'yakureki-safety-v1'}};

/* ======================================================================
 専門史「薬害から医薬品安全へ」 ロジックとUI
 ・本編の S / PROD / fmt / save / recalc / notify / safe を使う（同じ機能を重複して作らない）
 ・進行状況は本編とは別のキー（yakureki-safety-v1）に保存する。本編のセーブ形式は変えない
 ・ここで例外が起きても本編が止まらないよう、入口はすべて try/catch で囲む
 ====================================================================== */
var sf=null; // 専門史の状態（var：本編の recalc から先に参照されても TDZ にならないように）
const SF_KEY=SPECIAL_HISTORIES.safety.saveKey, SF_VER=1;
const SF_EV=Object.fromEntries(SAFETY_EVENTS.map(x=>[x.id,x]));
const SF_CASE=Object.fromEntries(SAFETY_CASES.map(x=>[x.id,x]));
const SF_TECH=Object.fromEntries(SAFETY_TECHS.map(x=>[x.id,x]));
const SF_Q=Object.fromEntries(SAFETY_QUESTIONS.map(x=>[x.id,x]));
const SF_CH=Object.fromEntries(SAFETY_CHAPTERS.map(x=>[x.no,x]));
const SF_REC_W=0.5, SF_GAP_HIGH=1.5, SF_TRUST=1.05; // 記録1件の寄与／「高」の境目／LOWのときの本編生産ボーナス（+5%）
function sfNew(){ return {v:SF_VER,unlockSeen:false,chapter:1,cases:{},sort:{},records:{},techs:{},cost:{},reviews:{},oath:false,final:{},endingSeen:false}; }
function sfLoad(){
  sf=sfNew();
  try{ const raw=safe(()=>localStorage.getItem(SF_KEY),null); if(!raw) return; const o=JSON.parse(raw); if(!o||typeof o!=='object') return;
    const keep=(src,dict)=>{ const r={}; if(src&&typeof src==='object') for(const k in src) if(dict[k]) r[k]=src[k]; return r; };
    sf.unlockSeen=!!o.unlockSeen; sf.chapter=Math.min(6,Math.max(1,Math.floor(+o.chapter||1)));
    sf.cases=keep(o.cases,SF_CASE); sf.sort=keep(o.sort,SF_CASE); sf.records=keep(o.records,SF_EV); sf.techs=keep(o.techs,SF_TECH);
    sf.cost={}; if(o.cost&&typeof o.cost==='object') for(const k in o.cost) if(SF_TECH[k]&&isFinite(+o.cost[k])&&+o.cost[k]>0) sf.cost[k]=+o.cost[k];
    sf.reviews=keep(o.reviews,SF_Q); sf.oath=!!o.oath; sf.final=(o.final&&typeof o.final==='object')?o.final:{}; sf.endingSeen=!!o.endingSeen;
  }catch(e){ sf=sfNew(); }
}
function sfSave(){ if(!sf) return; safe(()=>localStorage.setItem(SF_KEY,JSON.stringify(sf))); }
function sfReset(){ safe(()=>localStorage.removeItem(SF_KEY)); sf=sfNew(); }
const sfUnlocked=()=>!!(S&&S.cleared);

/* ---------- 進行の判定 ---------- */
const sfCaseOf=ch=>SAFETY_CASES.find(c=>c.chapter===ch);
const sfSolved=id=>!!(sf.cases[id]&&sf.cases[id].solved);
function sfRecAvail(r){ if(r.chapter>sf.chapter) return false; const p=r.prerequisite; return p.indexOf('case:')===0?sfSolved(p.slice(5)):!!sf.records[p]; }
const sfTechAvail=t=>!!sf.records[t.from];
function sfTechCost(t){ if(!sf.cost[t.id]) sf.cost[t.id]=Math.max(100,Math.ceil((PROD||0)*t.sec)); return sf.cost[t.id]; } // 解禁した時点の生産量で価格を固定する
const sfChMax=ch=>SAFETY_EVENTS.filter(r=>r.chapter===ch).length*SF_REC_W+SAFETY_TECHS.filter(t=>SF_EV[t.from].chapter===ch).reduce((a,t)=>a+t.w,0);
const SF_TOTAL=SAFETY_CHAPTERS.reduce((a,c)=>a+sfChMax(c.no),0);
function sfDev(){ let d=0; for(let c=1;c<=Math.min(5,sf.chapter);c++) d+=sfChMax(c); return d; } // DRUG DEVELOPMENT：章を開いたときにだけ増える（時間では増えない）
function sfSys(){ return Object.keys(sf.records).length*SF_REC_W+SAFETY_TECHS.filter(t=>sf.techs[t.id]).reduce((a,t)=>a+t.w,0); }
function sfGap(){ const g=sfDev()-sfSys(); return g<=0.001?'low':g<=SF_GAP_HIGH?'mid':'high'; }
// 本編の recalc から呼ばれる：専門史が LOW のときだけ、本編の生産に小さな信頼ボーナス
function sfTrust(){ try{ return (sf&&sfUnlocked()&&sf.chapter>=1&&Object.keys(sf.records).length&&sfGap()==='low')?SF_TRUST:1; }catch(e){ return 1; } }
const sfCanAdvance=()=>sf.chapter<=5&&sfSolved(sfCaseOf(sf.chapter).id)&&sfGap()!=='high';

/* ---------- 画面の状態（保存しない） ---------- */
let sfUI={tab:'progress',view:'home',ch:1,caseId:null,step:'intro',pick:null,sortSeq:[],sortMsg:'',rq:0,rch:1,rpick:[],ranswered:false,fstep:0,fpick:null};
const $sf=id=>document.getElementById(id);
const sfOpen=()=>{ const r=$sf('sfRoot'); return !!(r&&!r.hidden); };

const P_=a=>a.map(x=>'<p>'+x+'</p>').join('');

function openSafety(view){ try{
  if(!sfUnlocked()) return;
  if(!sf) sfLoad();
  if(!$sf('ending').hidden){ $sf('ending').hidden=true; }
  closeSheet&&closeSheet();
  sf.unlockSeen=true; sfSave();
  sfUI.tab='progress'; sfUI.view=view||'home'; sfUI.ch=Math.min(5,sf.chapter);
  $sf('sfRoot').hidden=false; document.documentElement.classList.add('sf-open'); $sf('coach').hidden=true; holdToast();
  sfRender(); $sf('sfScroll').scrollTop=0;
 }catch(e){ console.error(e); toast('専門史を開けませんでした'); } }
function closeSafety(){ $sf('sfRoot').hidden=true; document.documentElement.classList.remove('sf-open'); sfCloseSheet(); sfSave(); recalc(); renderAll(); setTimeout(()=>{ runQueue(); coachUpdate(); pumpN(); },50); }

/* ---------- 描画 ---------- */
function sfRender(){
  const full=['case','final','oath','end'].includes(sfUI.view);
  $sf('sfRoot').classList.toggle('sf-full',full);
  $sf('sfTop').innerHTML=sfTopHtml(full);
  let h='';
  if(sfUI.view==='case') h=sfCaseHtml(); else if(sfUI.view==='final') h=sfFinalHtml(); else if(sfUI.view==='oath') h=sfOathHtml(); else if(sfUI.view==='end') h=sfEndHtml();
  else if(sfUI.view==='review') h=sfReviewHtml(); else if(sfUI.view==='chapter') h=sfChapterHtml(sfUI.ch);
  else if(sfUI.tab==='records') h=sfRecordsHtml(); else if(sfUI.tab==='techs') h=sfTechsHtml(); else if(sfUI.tab==='timeline') h=sfTimelineHtml(); else if(sfUI.tab==='archive') h=sfArchiveHtml(); else h=sfHomeHtml();
  $sf('sfBody').innerHTML=h;
  const act=full?'':['chapter','review'].includes(sfUI.view)?'progress':sfUI.tab;
  document.querySelectorAll('#sfNav button').forEach(b=>b.classList.toggle('on',b.dataset.sfTab===act));
  sfAfford();
}
function sfTopHtml(full){
  return '<button class="sf-back" data-sf="exit">← 本編へ戻る</button>'+

function sfGapHtml(){
  const d=sfDev(), s=sfSys(), g=sfGap(), L={high:['HIGH','高'],mid:['MEDIUM','中'],low:['LOW','低']}[g];
  const w=x=>Math.max(0,Math.min(100,100*x/SF_TOTAL)).toFixed(1)+'%';
  return '<div class="sf-gap sf-gap-'+g+'"><div class="sf-bar"><span>DRUG DEVELOPMENT</span><div><i style="width:'+w(d)+'"></i></div></div>'+

   (g==='high'?'<div class="sf-gapm">安全の仕組みが、薬の進歩に追いついていません。<br>HISTORY RECORD を読み、SAFETY TECHNOLOGY を整備してください。</div>':
    g==='low'?'<div class="sf-gapm">TRUST BONUS：安全の仕組みが追いついています。本編の生産 +'+Math.round((SF_TRUST-1)*100)+'%</div>':'<div class="sf-gapm">次の章へ進めます。</div>')+'</div>';
}
function sfHomeHtml(){
  let h='<div class="sf-hero"><div class="sf-k">SPECIAL HISTORY</div><h1>'+SPECIAL_HISTORIES.safety.title+'</h1><div class="sf-en">'+SPECIAL_HISTORIES.safety.en+'</div>'+
   '<p>本編は、薬を作る歴史でした。ここでは、薬を安全に使う仕組みが、どのように作られてきたかをたどります。</p>'+
   '<p class="sf-mute">各章では、まず架空の医薬品で安全性の問題を判断します。そのあとで、実際に起きた歴史が開示されます。</p></div>'+sfGapHtml();
  SAFETY_CHAPTERS.forEach(c=>{ const open=c.no<=sf.chapter, cur=c.no===sf.chapter, cs=sfCaseOf(c.no), rs=SAFETY_EVENTS.filter(r=>r.chapter===c.no);

      (open?'<small>CASE '+(sfSolved(cs.id)?'✓':'—')+'　RECORD '+rs.filter(r=>sf.records[r.id]).length+'/'+rs.length+'</small>':'')+'</span><em>'+st+'</em></button>'; });

  if(sf.final.done) h+='<button class="sf-btn sub" data-sf="end">エンディングを見る</button>';

function sfChapterHtml(no){
  const c=SF_CH[no], cs=sfCaseOf(no), rs=SAFETY_EVENTS.filter(r=>r.chapter===no), ts=SAFETY_TECHS.filter(t=>SF_EV[t.from].chapter===no), qs=SAFETY_QUESTIONS.filter(q=>q.chapter===no);
  let h='<button class="sf-link" data-sf="home">← 章の一覧</button><div class="sf-chh"><span class="sf-no sf-nob">'+c.roman+'</span><div><div class="sf-k">CHAPTER '+c.roman+'　'+c.en+'</div><h2>'+c.title+'</h2><small>'+c.span+'　'+c.theme+'</small></div></div>';

  // 1. CASE
  const cr=sf.cases[cs.id];
  h+='<div class="sf-sec">1　SAFETY CASE</div><div class="sf-card"><div class="sf-fict">FICTIONAL CASE　この症例と医薬品は架空です</div><b>'+cs.title+'</b><div class="sf-mute">'+cs.drug+'（'+cs.kind+'）・'+cs.era+'</div>'+
   (cr&&cr.solved?'<div class="sf-ok">判断済み　初回の判断：'+SAFETY_GRADES[cr.first].ja+'</div><button class="sf-btn sub" data-sf="case" data-arg="'+cs.id+'">もう一度見る</button>':'<button class="sf-btn" data-sf="case" data-arg="'+cs.id+'">CASE を始める</button>')+'</div>';
  // 2. RECORDS

function sfCaseHtml(){
  const c=SF_CASE[sfUI.caseId], st=sfUI.step;

  if(st==='intro') return h+'<div class="sf-sit">'+c.situation+'</div><button class="sf-btn" data-sf="cstep" data-arg="cards">情報を確認する</button><button class="sf-link" data-sf="chapter" data-arg="'+c.chapter+'">← 章に戻る</button></div>';
  const cards='<div class="sf-sit">'+c.situation+'</div>'+c.cards.map(([t,x],i)=>'<div class="sf-info"><small>情報 '+(i+1)+'</small><b>'+t+'</b><div>'+x+'</div></div>').join('')+
    c.tools.filter(x=>sf.techs[x.tech]).map(x=>'<div class="sf-info tool"><small>追加情報　'+SF_TECH[x.tech].en+'（'+SF_TECH[x.tech].ja+'）</small><b>'+x.title+'</b><div>'+x.text+'</div></div>').join('');
  if(st==='cards') return h+cards+'<button class="sf-btn" data-sf="cstep" data-arg="decide">対応を判断する</button></div>';
  if(st==='decide') return h+'<div class="sf-q">DECISION　どう対応しますか。</div>'+c.options.map((o,i)=>'<button class="sf-opt" data-sf="cpick" data-arg="'+i+'">'+o.t+'</button>').join('')+'<button class="sf-link" data-sf="cstep" data-arg="cards">← 情報を見直す</button></div>';
  if(st==='result'){ const o=c.options[sfUI.pick], G=SAFETY_GRADES[o.g];
    h+='<div class="sf-res g-'+o.g+'"><div class="sf-k">RESULT</div><b>'+G.en+'</b><span>'+G.ja+'</span></div><div class="sf-chosen">あなたの判断：'+o.t+'</div>';
    if(o.g!=='ok') return h+'<div class="sf-fb">'+o.fb+'</div><button class="sf-btn" data-sf="cstep" data-arg="decide">もう一度選ぶ</button><button class="sf-link" data-sf="cstep" data-arg="cards">← 情報を見直す</button></div>';
    return h+'<div class="sf-fb"><b>判断の理由</b>'+c.reason+'</div><div class="sf-lesson">'+c.lesson+'</div><button class="sf-btn" data-sf="cstep" data-arg="'+(c.sort?'sort':'record')+'">'+(c.sort?'機序を確かめる':'実際の歴史を見る')+'</button></div>'; }
  if(st==='sort'){ const seq=sfUI.sortSeq, order=sfSortOrder();
    h+='<div class="sf-q">'+SAFETY_SORT.title+'　<small>はじめから順にタップ</small></div><div class="sf-sortseq">'+SAFETY_SORT.items.map((x,i)=>'<span class="'+(i<seq.length?'on':'')+'">'+(i<seq.length?(i+1)+'. '+SAFETY_SORT.items[seq[i]]:(i+1)+'. ……')+'</span>').join('')+'</div>';
    if(seq.length===SAFETY_SORT.items.length) return h+'<div class="sf-fb">'+SAFETY_SORT.done+'</div><button class="sf-btn" data-sf="cstep" data-arg="record">実際の歴史を見る</button></div>';
    return h+'<div class="sf-sortpool">'+order.filter(i=>!seq.includes(i)).map(i=>'<button class="sf-opt" data-sf="spick" data-arg="'+i+'">'+SAFETY_SORT.items[i]+'<small>'+SAFETY_SORT.ja[i]+'</small></button>').join('')+'</div>'+(sfUI.sortMsg?'<div class="sf-fb">'+sfUI.sortMsg+'</div>':'')+'</div>'; }
  if(st==='record'){ const r=SF_EV[c.records[0]];
    return '<div class="sf-case">'+sfRecHtml(r,true)+'<div class="sf-lesson">教訓　'+c.lesson+'</div><button class="sf-btn" data-sf="chapter" data-arg="'+c.chapter+'">章に戻る</button></div>'; }
  return h+'</div>';
}

function sfSortOrder(){ if(!sfSortShuffle){ sfSortShuffle=[2,4,0,3,1]; } return sfSortShuffle; }
function sfCasePick(i){ const c=SF_CASE[sfUI.caseId], o=c.options[i]; sfUI.pick=i;
  const r=sf.cases[c.id]||{}; if(!r.first) r.first=o.g; // 初回の判断だけを記録（firstAttemptCorrect）
  if(o.g==='ok'){ r.solved=true; }

    if(sfUI.pick!=null&&F.options[sfUI.pick]&&F.options[sfUI.pick].g!=='ok'){ const o=F.options[sfUI.pick]; h+='<div class="sf-res g-'+o.g+'"><b>'+SAFETY_GRADES[o.g].en+'</b><span>'+SAFETY_GRADES[o.g].ja+'</span></div><div class="sf-fb">'+o.fb+'</div>'; }
    return h+'<button class="sf-link" data-sf="fstep" data-arg="3">← 患者の情報を見直す</button></div>'; }
  if(s===5) return h+'<div class="sf-res g-ok"><b>APPROPRIATE</b><span>妥当</span></div><div class="sf-box"><b>疑義照会の結果</b><div>'+F.inquiry+'</div></div><div class="sf-box"><b>服薬指導</b><div>'+F.counsel+'</div></div><button class="sf-btn" data-sf="fstep" data-arg="6">記録と報告へ</button></div>';
  if(s===6){ h+='<div class="sf-q">冷や汗とふらつきは、グリセタンによる低血糖の可能性がある。この情報を、どうするか。</div>';
    if(T('T3')){ h+=F.report.map((o,i)=>'<button class="sf-opt" data-sf="frep" data-arg="'+i+'">'+o.t+'</button>').join('');
      if(sfUI.pick!=null&&F.report[sfUI.pick]&&F.report[sfUI.pick].g!=='ok') h+='<div class="sf-res g-'+F.report[sfUI.pick].g+'"><b>'+SAFETY_GRADES[F.report[sfUI.pick].g].en+'</b><span>'+SAFETY_GRADES[F.report[sfUI.pick].g].ja+'</span></div><div class="sf-fb">'+F.report[sfUI.pick].fb+'</div>'; }
    else h+='<div class="sf-fb">'+F.noSignal+'</div><button class="sf-btn sub" data-sf="frep" data-arg="0">記録して次へ</button>';
    return h+'</div>'; }
  if(s===7){ const rp=!!sf.final.reported;
    return h+'<div class="sf-res g-ok"><b>'+(rp?'REPORTED':'RECORDED')+'</b><span>'+(rp?'報告':'記録')+'</span></div><div class="sf-fb">'+(rp?F.reportOk:'薬歴に記録を残した。')+'</div>'+
    '<div class="sf-cycle">'+F.cycle.map(([en,ja])=>'<div><b>'+en+'</b><small>'+ja+'</small></div>').join('<i>→</i>')+'<div class="back">↺ REPORT</div></div><div class="sf-lesson">'+(rp?F.cycleText:F.cycleAlt)+'</div>'+
    '<div class="sf-flow"><span>患者</span><i>→</i><span>薬剤師が副作用を疑う</span><i>→</i><span>報告</span><i>→</i><span>次の安全性情報へ</span></div><button class="sf-btn" data-sf="fdone">終える</button></div>'; }
  return h+'</div>';
}
/* ---------- エンディング（黒地・文字だけ。本編のエンディングと同じ部品を使う） ---------- */
function sfEndHtml(){
  const cs=SAFETY_CASES.filter(c=>sf.cases[c.id]&&sf.cases[c.id].first==='ok').length, rv=SAFETY_QUESTIONS.filter(q=>sf.reviews[q.id]&&sf.reviews[q.id].first).length;
  const rec=[['SAFETY CASE　初回判断',cs+' / '+SAFETY_CASES.length],['SAFETY REVIEW　正答',rv+' / '+SAFETY_QUESTIONS.length],['SAFETY TECHNOLOGY',SAFETY_TECHS.filter(t=>sf.techs[t.id]).length+' / '+SAFETY_TECHS.length],['HISTORY RECORD',Object.keys(sf.records).length+' / '+SAFETY_EVENTS.length]];
  let d=0; const L=s=>'<span class="sf-line" style="--d:'+(d+=0.55).toFixed(2)+'s">'+s+'</span>';
  return '<div class="sf-end"><section class="end-sec"><p class="end-k">SPECIAL HISTORY　'+SPECIAL_HISTORIES.safety.title+'</p><h1 class="end-big end-gold" style="letter-spacing:.18em;font-size:1.25rem">PHARMACOVIGILANCE<br>COMPLETE</h1>'+
     SAFETY_ENDING.lines.map(g=>'<p class="end-p">'+g.map(L).join('<br>')+'</p>').join('')+'<p class="end-scroll">SCROLL ↓</p></section>'+
   '<section class="end-sec short"><p class="end-p mute" style="font-size:.76rem">'+SAFETY_ENDING.link.join('<br>')+'</p></section>'+
   '<section class="end-sec"><h2 class="end-h">YOUR SAFETY RECORD</h2><hr class="end-rule">'+rec.map(r=>'<div class="end-rec"><span>'+r[0]+'</span><i></i><b>'+r[1]+'</b></div>').join('')+'</section>'+
   '<section class="end-sec"><h2 class="end-h">CREDITS</h2><div class="end-cr"><small>DEVELOPED BY</small><div>'+DEVELOPER+'</div></div><div class="end-cr"><small>DEVELOPMENT SUPPORT</small><div>Claude<br>ChatGPT</div></div><div class="end-cr"><small>SPECIAL THANKS</small><div>このゲームを遊んでくださった皆さま</div></div></section>'+
   '<section class="end-sec"><p class="end-k">THANK YOU FOR PLAYING</p><h2 class="end-title" style="font-size:1.5rem">'+GAME_NAME+'</h2><p class="end-p mute" style="font-family:var(--e-mono);margin-top:14px">ver.'+GAME_VER+'</p>'+
     '<button class="end-go" data-sf="home">専門史の記録へ</button><button class="end-go" style="margin-top:12px;background:none;color:var(--e-mute);border:1px solid var(--e-line)" data-sf="exit">本編へ戻る</button></section></div>';
}

/* ---------- 操作 ---------- */
function sfAction(a,arg){
  if(a==='exit'){ closeSafety(); return; }
  if(a==='sheetx'){ sfCloseSheet(); return; }
  if(a==='tab'){ sfUI.tab=arg; sfUI.view='home'; sfCloseSheet(); sfRender(); $sf('sfScroll').scrollTop=0; return; }
  if(a==='home'){ sfUI.tab='progress'; sfUI.view='home'; sfRender(); $sf('sfScroll').scrollTop=0; return; }
  if(a==='chapter'){ sfUI.view='chapter'; sfUI.ch=+arg; sfCloseSheet(); sfRender(); $sf('sfScroll').scrollTop=0; return; }
  if(a==='rec'){ sfReadRec(arg); return; }
  if(a==='buy'){ const t=SF_TECH[arg]; if(!t||sf.techs[t.id]||!sfTechAvail(t)) return; const c=sfTechCost(t); if(S.kp<c){ toast('知識Pが足りません'); return; }
    S.kp-=c; sf.techs[t.id]=1; sfSave(); recalc(); save(); sfRender(); return; }
  if(a==='case'){ sfUI.caseId=arg; sfUI.step='intro'; sfUI.pick=null; sfUI.sortSeq=[]; sfUI.sortMsg=''; sfUI.view='case'; sfRender(); $sf('sfScroll').scrollTop=0; return; }
  if(a==='cstep'){ if(arg==='record') sfCaseRecordOpen(); sfUI.step=arg; sfRender(); $sf('sfScroll').scrollTop=0; return; }
  if(a==='cpick'){ sfCasePick(+arg); return; }
  if(a==='spick'){ const i=+arg, need=sfUI.sortSeq.length; if(i===need){ sfUI.sortSeq.push(i); sfUI.sortMsg=''; if(sfUI.sortSeq.length===SAFETY_SORT.items.length){ sf.sort[sfUI.caseId]=1; sfSave(); } }
    else sfUI.sortMsg='その前に起こることがあります。'+(need?'「'+SAFETY_SORT.ja[need-1]+'」の次は何か、考えてみよう。':'出発点は、患者が飲んだ薬です。'); sfRender(); return; }
  if(a==='review'){ sfUI.view='review'; sfUI.rch=+arg; sfUI.rq=0; sfUI.rpick=[]; sfUI.ranswered=false; sfRender(); $sf('sfScroll').scrollTop=0; return; }
  if(a==='rpick'){ const q=SAFETY_QUESTIONS.filter(x=>x.chapter===sfUI.rch)[sfUI.rq], i=+arg;
    if(q.multi){ sfUI.rpick=sfUI.rpick.includes(i)?sfUI.rpick.filter(x=>x!==i):sfUI.rpick.length<q.multi?sfUI.rpick.concat(i):sfUI.rpick; sfRender(); return; }
    sfUI.rpick=[i]; sfAnswer(); return; }
  if(a==='ranswer'){ const q=SAFETY_QUESTIONS.filter(x=>x.chapter===sfUI.rch)[sfUI.rq]; if(sfUI.rpick.length!==q.multi) return; sfAnswer(); return; }
  if(a==='rnext'){ sfUI.rq++; sfUI.rpick=[]; sfUI.ranswered=false; sfRender(); $sf('sfScroll').scrollTop=0; return; }
  if(a==='advance'){ if(!sfCanAdvance()) return; sf.chapter++; sfSave(); recalc();
    if(sf.chapter<=5){ sfUI.view='chapter'; sfUI.ch=sf.chapter; } else { sfUI.view='home'; sfUI.tab='progress'; }
    sfRender(); $sf('sfScroll').scrollTop=0; return; }
  if(a==='epilogue'){ if(sf.chapter<6) return; sfUI.view='oath'; sfRender(); $sf('sfScroll').scrollTop=0; return; }
  if(a==='oathnext'){ sf.oath=true; sfSave(); sfUI.view='final'; sfUI.fstep=0; sfUI.fpick=null; sfUI.pick=null; sfRender(); $sf('sfScroll').scrollTop=0; return; }
  if(a==='fstep'){ sfUI.fstep=+arg; sfUI.pick=null; sfRender(); $sf('sfScroll').scrollTop=0; return; }
  if(a==='fpat'){ sfUI.fpick=arg; if(!sf.final.firstPick) sf.final.firstPick=arg; sfSave(); if(arg==='A'){ sfUI.fstep=3; $sf('sfScroll').scrollTop=0; } sfRender(); return; }
  if(a==='fdec'){ const o=SAFETY_FINAL.options[+arg]; sfUI.pick=+arg; if(!sf.final.firstDecision) sf.final.firstDecision=o.g; sfSave(); if(o.g==='ok'){ sfUI.fstep=5; sfUI.pick=null; $sf('sfScroll').scrollTop=0; } sfRender(); return; }
  if(a==='frep'){ const i=+arg, o=SAFETY_FINAL.report[i]; sfUI.pick=i;
    if(!sf.techs.T3||o.g==='ok'){ sf.final.reported=o.g==='ok'; sfSave(); sfUI.fstep=7; sfUI.pick=null; $sf('sfScroll').scrollTop=0; } sfRender(); return; }
  if(a==='fdone'){ sf.final.done=true; sf.endingSeen=true; sfSave(); sfUI.view='end'; sfRender(); $sf('sfScroll').scrollTop=0; return; }
  if(a==='end'){ sfUI.view='end'; sfRender(); $sf('sfScroll').scrollTop=0; return; }
  if(a==='enter'){ openSafety(); return; }
  if(a==='openrec'){ openSafety(); sfReadRec(arg); return; }
}
document.addEventListener('click',e=>{ const el=e.target.closest('[data-sf]'); if(!el) { if(e.target===$sf('sfOv')) sfCloseSheet(); return; }
  if(el.disabled) return; e.stopPropagation();
  try{ sfAction(el.dataset.sf,el.dataset.arg); }catch(err){ console.error(err); toast('専門史でエラーが起きました（本編は続けて遊べます）'); } },true);
document.addEventListener('keydown',e=>{ if(e.key!=='Escape'||!sfOpen()) return; if($sf('sfOv').classList.contains('show')) sfCloseSheet(); else closeSafety(); });
setInterval(()=>{ try{ if(sfOpen()) sfAfford(); }catch(e){} },500);

/* 本編の図鑑・歴史から、専門史の関連記録へ（記録を読んだあとだけ記録へ直接移動。未読なら入口だけを示す） */
const SF_MAIN_LINK={ev:{elixir_sulfanilamide:'N01',thalidomide:'N05',smon:'N08'},drug:{prontosil:'N01',penicillin:'N03',thalidomide:'N05',chinoform:'N08'}};
function sfMainLink(kind,id){ try{
  if(!sfUnlocked()) return ''; if(!sf) sfLoad(); const rid=(SF_MAIN_LINK[kind]||{})[id]; if(!rid) return ''; const r=SF_EV[rid];
  return '<div class="box"><b>専門史「'+SPECIAL_HISTORIES.safety.title+'」</b><div style="margin-top:6px">'+(sf.records[rid]?'<button class="lk th" data-sf="openrec" data-arg="'+rid+'">'+r.titleJa+' を読む ›</button>':'<button class="lk" data-sf="enter">この出来事は専門史で扱っています ›</button>')+'</div></div>';
 }catch(e){ return ''; } }


try{ sfLoad(); }catch(e){ sf=sfNew(); }
load(); recalc(); progress(true);
if(S.lastSeen){ activeAt=S.lastSeen; claimAway(); }
if(S.era>=6&&!S.medShown) queue.push({k:'med'});
if(S.era>=8&&!S.kinShown) queue.push({k:'kin'});
if(S.era>=10&&!S.kdShown) queue.push({k:'kd'});
if(S.eraShown<S.era) queue.push({k:'era',era:S.era});
if(S.cleared&&!S.clearShown) queue.push({k:'clear'});
// すでにクリア済みのプレイヤーには、専門史が開いたことを一度だけ知らせる
try{ if(S.cleared&&S.clearShown&&sf&&!sf.unlockSeen){ notify({k:'w',msg:'📖 専門史「'+SPECIAL_HISTORIES.safety.title+'」が解放されました。記録タブから入れます。'}); sf.unlockSeen=true; sfSave(); } }catch(e){}
renderAll(); runQueue();
if(!S.prologueDone) showPrologue();
window.__game={DRUGS,PEOPLE,techCost,S:()=>S,research,buy,buyUp,progress,recalc,renderAll,tick,setTab,TECHS,FACS,EVENTS,setQty:q=>{qty=q;},giveKp:n=>{S.kp+=n;},checkPeopleNet,P,get PROD(){return PROD;},reset:()=>{safe(()=>localStorage.removeItem(SAVE_KEY));},safety:{state:()=>sf,open:openSafety,close:closeSafety,act:(a,x)=>sfAction(a,x),gap:sfGap,dev:sfDev,sys:sfSys,trust:sfTrust,questions:SAFETY_QUESTIONS}};
})();
</script>
